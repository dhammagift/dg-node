<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DG Apps Board</title>
<link rel="icon" href="/assets/img/read/favicon-black.png">
<style>
  /* Layout: header, a "what to do" list, one card per product, common links. Light by default. */
  :root {
    --bg: #f7f7f4; --panel: #ffffff; --fg: #1f1e1c; --muted: #6b6a65; --line: #e3e1da;
    --ok: #2f7d4f; --warn: #a86411; --bad: #b3261e; --accent: #3b6ea8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b19; --panel: #252522; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3935;
      --ok: #6cc28f; --warn: #e3a64a; --bad: #f08a80; --accent: #8fb6e6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b19; --panel: #252522; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3935;
    --ok: #6cc28f; --warn: #e3a64a; --bad: #f08a80; --accent: #8fb6e6; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
  .wrap { max-width: 1200px; margin-inline: auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 28px; }
  h1 { font: 400 28px/1.15 var(--serif); margin: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .take { color: var(--muted); margin: 6px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .btn:hover, .btn:focus-visible { border-color: var(--muted); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; background: none; color: var(--muted); border: 0; padding: 5px 12px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--fg); }

  .todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todo li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .todo img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .todo b { font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .prod { display: flex; align-items: center; gap: 14px; }
  .prod img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .prod .n { font: 400 24px/1.1 var(--serif); }
  .prod .k { color: var(--muted); font-size: 13px; }
  .plat { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .plat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .plat-name { font-weight: 600; }
  .plat-name span { font-weight: 400; color: var(--muted); }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.wait { color: var(--muted); }
  .steps { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 6px; }
  .step { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .step .l { font-size: 12px; color: var(--muted); }
  .step .v { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .step.empty .v { color: var(--muted); }
  .step.hot { border-color: var(--warn); } .step.live { border-color: var(--ok); }
  .arrow { align-self: center; color: var(--muted); font-size: 12px; }
  .act { margin: 0; font-size: 13px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { font-size: 12px; color: var(--fg); text-decoration: none; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .links a.get { border-color: var(--ok); color: var(--ok); }
  .links a:hover, .links a:focus-visible { border-color: var(--muted); }

  .common { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 14px; }
  .common h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .common ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .common a { color: var(--fg); }
  .errs { color: var(--bad); font-size: 13px; margin: 0; padding-left: 18px; }

  .gate { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .gate p { color: var(--muted); max-width: 32rem; margin: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } .arrow { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="gate" id="gate">
    <h1>Приложения и расширения DG</h1>
    <p id="gate-msg">Страница только для владельца. Войдите через Google.</p>
    <button class="btn primary" id="login" type="button">Войти через Google</button>
  </div>

  <div id="board" hidden>
    <header class="top">
      <div>
        <h1>Приложения и расширения DG</h1>
        <p class="take" id="take"></p>
        <p class="meta" id="meta"></p>
      </div>
      <div class="tools">
        <button class="btn primary" id="refresh" type="button">Обновить из магазинов</button>
        <div class="seg" role="group" aria-label="Тема">
          <button type="button" data-theme-btn="light">Светлая</button>
          <button type="button" data-theme-btn="dark">Тёмная</button>
        </div>
        <button class="btn" id="logout" type="button">Выйти</button>
      </div>
    </header>
    <ul class="errs" id="errs"></ul>
    <section><h2>Что можно сделать</h2><ul class="todo" id="todo"></ul></section>
    <section><h2>Все приложения</h2><div class="grid" id="grid"></div></section>
    <section><h2>Общие ссылки</h2><div class="common" id="common"></div></section>
  </div>
</div>

const ICON_BY_KEY = (k) => k.startsWith('dg-') ? 'dg' : k.startsWith('dict-') ? 'dict' : k.startsWith('upo-') ? 'upo' : k.startsWith('noapp') ? 'noapp' : 'ext';
const PILL = { 'свежая': ['ok', 'всё свежее'], 'ждёт прода': ['warn', 'можно в прод'], 'не отправлена': ['warn', 'есть неотправленная'], 'на проверке': ['wait', 'на проверке'] };

// Theme: light unless the viewer picked dark (kept in this browser only).
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === t)));
  try { localStorage.setItem('apps-theme', t); } catch (e) {}
}
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('apps-theme') || 'light'; } catch (e) {}
setTheme(savedTheme);
document.querySelectorAll('[data-theme-btn]').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const img = (k, size) => { const i = el('img'); i.src = ICONS[ICON_BY_KEY(k)] || ''; i.alt = ''; i.width = size; i.height = size; return i; };
const link = (href, text, cls) => {
  if (!href || !/^https:\/\//.test(href)) return null;
  const a = el('a', cls, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a;
};
const empty = (v) => !v || v === '—';
function step(label, value, cls) {
  const s = el('div', 'step' + (empty(value) ? ' empty' : '') + (cls ? ' ' + cls : ''));
  s.append(el('span', 'l', label), el('span', 'v', empty(value) ? 'нет' : value));
  return s;
}
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'только что' : m < 60 ? m + ' мин назад' : Math.round(m / 60) + ' ч назад';
};

function render(data) {
  const rows = data.rows || [];
  const n = (s) => rows.filter((r) => r.status === s).length;
  document.getElementById('take').textContent =
    `Можно перевести в прод: ${n('ждёт прода')}. Есть неотправленные сборки: ${n('не отправлена')}. Всё свежее: ${n('свежая')}.`;
  const meta = document.getElementById('meta');
  meta.replaceChildren(document.createTextNode(`Данные из магазинов: ${new Date(data.generated_at).toLocaleString('ru-RU')} (${ago(data.generated_at)}). `));
  const runA = link(data.run_url, 'прогон'); if (runA) meta.append(runA);
  if (data.running) meta.append(document.createTextNode(' · идёт обновление…'));

  const errs = document.getElementById('errs'); errs.replaceChildren();
  (data.errors || []).forEach((e) => errs.append(el('li', null, 'Не прочиталось: ' + e)));

  const todo = document.getElementById('todo'); todo.replaceChildren();
  rows.filter((r) => r.status !== 'свежая').forEach((r) => {
    const li = el('li'); const t = el('div');
    t.append(el('b', null, `${r.product} · ${r.platform}: `), document.createTextNode(r.action));
    li.append(img(r.key, 28), t); todo.append(li);
  });
  if (!todo.children.length) todo.append(el('li', null, 'Всё свежее, делать ничего не нужно.'));

  const grid = document.getElementById('grid'); grid.replaceChildren();
  for (const p of [...new Set(rows.map((r) => r.product))]) {
    const list = rows.filter((r) => r.product === p);
    const card = el('article', 'card');
    const head = el('div', 'prod'); const names = el('div');
    names.append(el('div', 'n', p), el('div', 'k', ICON_BY_KEY(list[0].key) === 'ext' ? 'Расширение для браузера' : 'Приложение'));
    head.append(img(list[0].key, 56), names); card.append(head);
    for (const r of list) {
      const box = el('div', 'plat'); const h = el('div', 'plat-head');
      const nm = el('div', 'plat-name', r.platform + ' '); nm.append(el('span', null, '· ' + r.store));
      const [pc, pt] = PILL[r.status] || ['wait', r.status];
      h.append(nm, el('span', 'pill ' + pc, pt));
      const steps = el('div', 'steps');
      steps.append(
        step('У пользователей', r.live, r.status === 'свежая' ? 'live' : ''), el('span', 'arrow', '←'),
        step('В тесте', r.testing, r.status === 'ждёт прода' || r.status === 'на проверке' ? 'hot' : ''), el('span', 'arrow', '←'),
        step('Последняя у нас', r.ours, r.status === 'не отправлена' ? 'hot' : ''));
      const links = el('div', 'links');
      [link(r.apk_url, 'Скачать APK', 'get'), link(r.testflight_url, 'TestFlight', 'get'), link(r.store_url, 'Магазин'),
       link(r.console_url, 'Кабинет'), link(r.repo_url && r.repo_url + '/issues', 'GitHub issues'), link(r.repo_url, 'GitHub')]
        .forEach((a) => a && links.append(a));
      box.append(h, steps, el('p', 'act', r.action), links); card.append(box);
    }
    grid.append(card);
  }

  const common = document.getElementById('common'); common.replaceChildren();
  for (const g of [...new Set(LINKS.map((x) => x.group))]) {
    const col = el('div'); col.append(el('h3', null, g)); const ul = el('ul');
    LINKS.filter((x) => x.group === g).forEach((x) => { const a = link(x.url, x.title); if (a) { const li = el('li'); li.append(a); ul.append(li); } });
    col.append(ul); common.append(col);
  }
}

// --- Google login (Firebase, the same project as the site's login) ---
let auth = null;
function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.append(s); }); }
async function boot() {
  const cfg = await (await fetch('/config/sync-config.json', { cache: 'no-store' })).json();
  await loadScript('https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js');
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  auth = firebase.auth();
  auth.onAuthStateChanged((u) => (u ? load() : showGate('Страница только для владельца. Войдите через Google.')));
}
function showGate(msg) {
  document.getElementById('gate').hidden = false; document.getElementById('board').hidden = true;
  document.getElementById('gate-msg').textContent = msg;
}
async function api(path, init) {
  const token = await auth.currentUser.getIdToken();
  return fetch(path, { ...(init || {}), headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
}
let lastGenerated = '';
async function load() {
  const r = await api('/api/apps-status');
  if (r.status === 403) {
    const j = await r.json().catch(() => ({}));
    return showGate(`Адреса ${j.email || 'этого аккаунта'} нет в списке доступа. Войдите другим аккаунтом.`);
  }
  if (r.status === 404) return showGate('Данных пока нет: джоба Store status ещё ни разу не отработала.');
  if (!r.ok) return showGate('Не удалось получить данные (' + r.status + '). Попробуйте обновить страницу.');
  const data = await r.json();
  document.getElementById('gate').hidden = true; document.getElementById('board').hidden = false;
  render(data);
  return data;
}
document.getElementById('login').addEventListener('click', () => auth && auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(() => {}));
document.getElementById('logout').addEventListener('click', () => auth && auth.signOut());
document.getElementById('refresh').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Обновляю… (1–3 мин)';
  const before = (await load())?.generated_at || '';
  await api('/api/apps-status/refresh', { method: 'POST' });
  // Poll until the new status lands (the job takes about a minute), give up after 6 minutes.
  for (let i = 0; i < 24; i++) {
    await new Promise((ok) => setTimeout(ok, 15000));
    const d = await load();
    if (d && d.generated_at !== before) break;
  }
  btn.disabled = false; btn.textContent = 'Обновить из магазинов';
});
boot().catch(() => showGate('Не загрузился вход через Google. Обновите страницу.'));
</script>
