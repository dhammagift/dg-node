<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>404</title>
    <link rel="icon" type="image/png" href="/assets/img/favico-noglass.png" />
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <link href="/assets/css/extrastyles.css" rel="stylesheet" />
    <link href="/nodejs/res/css/home.css" rel="stylesheet" />
    <style>
        /* Compact variant of the home page's .dg-tile grid — same icon font, smaller than the
           card-sized home tiles (this is a secondary nav aid on an error page, not the primary
           way to browse), but still comfortably tappable. Sheet/mega popovers themselves come
           from home.css unmodified — only this button row is custom. */
        #dg-404-menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem 1.75rem; margin-top: 2rem; max-width: 34rem; }
        #dg-404-menu button { display: flex; flex-direction: column; align-items: center; gap: .4rem; width: 5.5rem; background: none; border: 0; padding: 0; color: var(--bs-emphasis-color); }
        #dg-404-menu button i, #dg-404-menu button svg { width: 1.7rem; height: 1.7rem; color: var(--bs-primary); }
        #dg-404-menu button span { font-size: .78rem; line-height: 1.15; text-align: center; }
    </style>
</head>
<body>
    <div class="d-flex align-items-center justify-content-center flex-column vh-100">
        <div class="text-center">
            <h1 class="display-1 fw-bold">404</h1>
            <p class="fs-3"><span class="text-danger">Aho!</span> <span data-404-text="p404">Page not found. But</span></p>
            <p class="lead">
                &ldquo;Atthi kho, &#257;vuso, maggo atthi pa&#7789;ipad&#257;,<br />
                etassa dukkhassa pari&ntilde;&ntilde;&#257;y&#257;&rdquo;ti.
                <a target="_blank" class="text-decoration-none" href="/sn38.4#1.4">sn38.4</a>
            </p>
            <a href="/" id="back" class="btn btn-primary" data-404-text="home">Go Home</a>
        </div>
        <nav id="dg-404-menu"></nav>
    </div>
    <script src="/assets/js/jquery-3.7.0.min.js"></script>
    <script src="/assets/js/bootstrap.bundle.5.3.1.min.js"></script>
    <script src="/assets/js/fontawesome-local.js" defer></script>
    <script defer src="/assets/js/themeswitch.js"></script>
    <script defer src="/assets/js/openDicts.js"></script>
    <script defer src="/assets/js/quickModal.js"></script>
    <script defer src="/nodejs/res/js/home.js"></script>
    <script>
        // Same precedence as search/index.html's own inline fallback seed (see the comment
        // right above its window.siteLanguage assignment): ?lang= override, then a /ru (or /r,
        // /ml, /mt) path prefix — same regex as that page's pathImpliesRu and settings.js's
        // window.notEn — then the stored preference, then "en". Previously missing the path
        // check entirely, which is why /ru/... URLs rendered English here whenever nothing was
        // already stored (own tab, cleared storage, etc.) while every other page on the site
        // got it right from the URL alone.
        window.dg404Lang = (function () {
            var qs = new URLSearchParams(location.search).get('lang');
            if (qs === 'ru' || qs === 'en') return qs;
            if (/^\/(ru|r|ml|mt)(\/|$)/.test(location.pathname)) return 'ru';
            return localStorage.getItem('siteLanguage') === 'ru' ? 'ru' : 'en';
        })();
        // search/js/home.js's own menuLang() checks window.DHAMMA_I18N.language first (before
        // localStorage) — that engine isn't loaded here on purpose (see comment below), but
        // without this stub home.js would resolve a DIFFERENT language than the button row
        // above it whenever dg404Lang came from the path rather than localStorage, and a click
        // would open the sheet/mega in the wrong language.
        window.DHAMMA_I18N = { language: window.dg404Lang };
    </script>
    <script>
        // Compact reproduction of the site's real multitool menu: same icon-name convention,
        // same data source (configs/search/menu-links.json — the "nothing invented" port of
        // the legacy horizontalMenuEn/Ru.php, see that file's own header comment), and clicks
        // go through the REAL search/js/home.js runTile() (exported as window.DgHome.runTile
        // for this page) — not a reimplementation, so "External"/"AI & Dicts"/etc. open the
        // actual sheet/mega popover in place, exactly like on the home page, instead of a
        // dead-end href guess. "Help" likewise opens /docs/multitool via runTile's own
        // modal==='help' branch (window.open), not hardcoded here. home.js is written
        // defensively throughout (guards every DOM lookup with `if (el)`) so loading it on a
        // page with none of the home-page markup is safe — verified live, no console errors.
        //
        // This script only builds the button row itself with its own small
        // configs/search/menu-links.json fetch (home.js's copy of the same data lives in its
        // own closure, unreachable from here); wrapped in try/catch since it's decoration on
        // top of the 404 page's actual job (message + Go Home), which must render regardless.
        (function () {
            var ICON_CLASS = {
                book: 'book-bookmark', bookmark: 'book', globe: 'book', dict: 'book-atlas',
                clock: 'clock-rotate-left', cap: 'graduation-cap', wrench: 'screwdriver-wrench',
                help: 'circle-question'
            };
            // Same default order as the home page tiles/drawer (DEFAULT_TILE_ORDER in
            // search/js/home.js) — menu-links.json's own key order doesn't match it (JSON
            // groups history/help right after read, the real site puts them last).
            var ORDER = {
                en: ['read', 'external', 'dicts', 'materials', 'tools', 'history', 'help'],
                ru: ['read', 'external', 'russian', 'dicts', 'materials', 'tools', 'history', 'help']
            };
            var lang = window.dg404Lang;
            fetch('/nodejs/res/menu-links.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var items = data[lang];
                    var host = document.getElementById('dg-404-menu');
                    ORDER[lang].forEach(function (key) {
                        var item = items[key];
                        if (!item) return;
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        var iconName = ICON_CLASS[item.icon] || 'circle-question';
                        // Same as faSvg() in search/js/home.js: these are added after page
                        // load (post-fetch), so fontawesome-local.js's DOMContentLoaded
                        // <i class="fa-solid fa-X"> auto-replace pass never sees them — call
                        // its SVG-generation API directly instead of relying on that scan.
                        var made = window.FontAwesome && window.FontAwesome.icon
                            ? window.FontAwesome.icon({ prefix: 'fas', iconName: iconName })
                            : null;
                        btn.innerHTML = (made && made.html && made.html[0])
                            ? made.html[0]
                            : '<i class="fa-solid fa-' + iconName + '" aria-hidden="true"></i>';
                        var label = document.createElement('span');
                        label.textContent = item.label;
                        btn.appendChild(label);
                        btn.addEventListener('click', function () {
                            if (window.DgHome && window.DgHome.runTile) window.DgHome.runTile(key, btn);
                            else window.location.href = (key === 'read' ? '/toc' : '/');
                        });
                        host.appendChild(btn);
                    });
                })
                .catch(function () { /* decoration only, see comment above */ });
        })();
    </script>
    <script>
        // Same client-side-only i18n convention as the rest of dg-node (see dg-light.js
        // comment near /manifest.json): no server-side language variants, just resolved once
        // above (window.dg404Lang) and read here. Inline strings rather than the shared
        // DHAMMA_I18N fetch engine on purpose — an error page should render even if a JSON
        // fetch would fail.
        (function () {
            var STRINGS = {
                ru: { p404: 'Страница не найдена. Но', home: 'На Главную' },
                en: { p404: 'Page not found. But', home: 'Go Home' }
            };
            var lang = window.dg404Lang;
            var t = STRINGS[lang] || STRINGS.en;
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-404-text]').forEach(function (el) {
                el.textContent = t[el.getAttribute('data-404-text')];
            });
        })();
    </script>
</body>
</html>
