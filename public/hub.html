<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DG Hub</title>
<link rel="icon" href="/assets/img/read/favicon-black.png">
<style>
  /* Layout: header, screen tabs; the apps screen is a "what to do" list and one card per product, the other screens
     (from the server's private hub.json) are cards of items. Light by default. */
  :root {
    --bg: #f7f7f4; --panel: #ffffff; --fg: #1f1e1c; --muted: #6b6a65; --line: #e3e1da;
    --ok: #2f7d4f; --warn: #a86411; --bad: #b3261e; --accent: #3b6ea8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b19; --panel: #252522; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3935;
      --ok: #6cc28f; --warn: #e3a64a; --bad: #f08a80; --accent: #8fb6e6; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1b19; --panel: #252522; --fg: #ecebe6; --muted: #a3a29b; --line: #3a3935;
    --ok: #6cc28f; --warn: #e3a64a; --bad: #f08a80; --accent: #8fb6e6; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
  .wrap { max-width: 1200px; margin-inline: auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 28px; }
  h1 { font: 400 28px/1.15 var(--serif); margin: 0; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .take { color: var(--muted); margin: 6px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 13px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .btn:hover, .btn:focus-visible { border-color: var(--muted); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: .6; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; background: none; color: var(--muted); border: 0; padding: 5px 12px; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--fg); }

  .todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todo li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .todo img { width: 28px; height: 28px; border-radius: 7px; flex: none; }
  .todo b { font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .prod { display: flex; align-items: center; gap: 14px; }
  .prod img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .prod .n { font: 400 24px/1.1 var(--serif); }
  .prod .k { color: var(--muted); font-size: 13px; }
  .plat { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .plat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .plat-name { font-weight: 600; }
  .plat-name span { font-weight: 400; color: var(--muted); }
  .plat-name img { width: 20px; height: 20px; border-radius: 5px; vertical-align: -4px; margin-right: 6px; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-head h2 { margin: 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.wait { color: var(--muted); }
  .steps { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 6px; }
  .step { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .step .l { font-size: 12px; color: var(--muted); }
  .step .v { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .step.empty .v { color: var(--muted); }
  .step.hot { border-color: var(--warn); } .step.live { border-color: var(--ok); }
  .arrow { align-self: center; color: var(--muted); font-size: 12px; }
  .act { margin: 0; font-size: 13px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { font-size: 12px; color: var(--fg); text-decoration: none; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .links a.get { border-color: var(--ok); color: var(--ok); }
  .links a:hover, .links a:focus-visible { border-color: var(--muted); }

  .errs { color: var(--bad); font-size: 13px; margin: 0; padding-left: 18px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .tabs button { font: inherit; font-size: 14px; background: none; color: var(--muted); border: 1px solid transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; }
  .tabs button[aria-current=page] { background: var(--panel); color: var(--fg); border-color: var(--line); }
  .item { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .item-name { font-weight: 600; } .item-name span { font-weight: 400; color: var(--muted); }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .ico { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; font-size: 18px; line-height: 1; }
  .ico.big { width: 34px; height: 34px; font-size: 28px; }
  .ico svg { display: block; }
  .prod img.ico { border-radius: 0; }
  .ico.letter { border-radius: 6px; background: var(--line); color: var(--fg); font: 600 12px/1 var(--sans); }
  .ico.big.letter { font-size: 16px; border-radius: 9px; }
  .item-name { display: flex; align-items: center; gap: 8px; }
  .common { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 14px; }
  .common h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .common ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .common a { color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .common a:hover { text-decoration: underline; }
  .common .ico { width: 16px; height: 16px; font-size: 14px; }
  .metrics { display: flex; flex-wrap: wrap; gap: 6px; }
  .metric { border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; display: flex; flex-direction: column; min-width: 4.5rem; }
  .metric .l { font-size: 11px; color: var(--muted); } .metric .v { font-variant-numeric: tabular-nums; }
  .metric.hot { border-color: var(--warn); } .metric.bad { border-color: var(--bad); }
  .procs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .procs span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .procs span::before { content: "●"; margin-right: 4px; color: var(--ok); } .procs span.down::before { color: var(--bad); }
  .grid:has(.map) { grid-template-columns: 1fr; }
  .card.map { overflow-x: auto; } .card.map svg { max-width: 100%; height: auto; min-width: 760px; }
  .role { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .role.main { color: var(--ok); } .role.standby { color: var(--accent); } .role.stale { color: var(--warn); } .role.off { color: var(--muted); }
  .node { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .dot { font-size: 12px; white-space: nowrap; } .dot::before { content: "●"; margin-right: 4px; }
  .dot.up { color: var(--ok); } .dot.down { color: var(--bad); }
  .gate { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .gate p { color: var(--muted); max-width: 32rem; margin: 0; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } .arrow { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="gate" id="gate">
    <h1>DG Hub</h1>
    <p id="gate-msg">Страница только для владельца. Войдите через Google.</p>
    <button class="btn primary" id="login" type="button">Войти через Google</button>
  </div>

  <div id="board" hidden>
    <header class="top">
      <div>
        <h1>DG Hub</h1>
        <p class="take" id="take"></p>
        <p class="meta" id="meta"></p>
      </div>
      <div class="tools">
        <button class="btn primary" id="refresh" type="button">Обновить из магазинов</button>
        <div class="seg" role="group" aria-label="Тема">
          <button type="button" data-theme-btn="light">Светлая</button>
          <button type="button" data-theme-btn="dark">Тёмная</button>
        </div>
        <button class="btn" id="logout" type="button">Выйти</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Экраны"></nav>
    <ul class="errs" id="errs"></ul>
    <div id="view-apps">
    <section><h2>Что можно сделать</h2><ul class="todo" id="todo"></ul></section>
    <section>
      <div class="sec-head"><h2 id="grid-title">Все приложения</h2>
        <div class="seg" role="group" aria-label="Группировка">
          <button type="button" data-view-btn="apps">По приложениям</button>
          <button type="button" data-view-btn="stores">По магазинам</button>
        </div></div>
      <div class="grid" id="grid"></div></section>
    </div>
    <div id="view-hub" hidden>
      <div class="sec-head"><p class="meta" id="hub-meta"></p>
        <div class="seg" role="group" aria-label="Группировка" id="infra-seg" hidden>
          <button type="button" data-infra-btn="servers">По серверам</button>
          <button type="button" data-infra-btn="endpoints">По сервисам</button>
        </div></div>
      <div class="grid" id="hub-grid"></div></div>
    <section id="common-sec" hidden><h2>Все ссылки</h2><div class="common" id="common"></div></section>
  </div>
</div>

const PILL = { 'свежая': ['ok', 'всё свежее'], 'ждёт прода': ['warn', 'можно в прод'], 'не отправлена': ['warn', 'есть неотправленная'], 'на проверке': ['wait', 'на проверке'] };

// Theme: light unless the viewer picked dark (kept in this browser only).
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === t)));
  try { localStorage.setItem('apps-theme', t); } catch (e) {}
  if (window.redrawMap) window.redrawMap();  // the map is drawn for one theme
}

function render(data) {
  lastData = data;
  const rows = data.rows || [];
  const n = (s) => rows.filter((r) => r.status === s).length;
  document.getElementById('take').textContent =
    `Можно перевести в прод: ${n('ждёт прода')}. Есть неотправленные сборки: ${n('не отправлена')}. Всё свежее: ${n('свежая')}.`;
  const meta = document.getElementById('meta');
  meta.replaceChildren(document.createTextNode(`Данные из магазинов: ${new Date(data.generated_at).toLocaleString('ru-RU')} (${ago(data.generated_at)}). `));
  const runA = link(data.run_url, 'прогон'); if (runA) meta.append(runA);

  const todo = document.getElementById('todo'); todo.replaceChildren();
  rows.filter((r) => r.status !== 'свежая').forEach((r) => {
    const li = el('li'); const t = el('div');
    t.append(el('b', null, `${r.product} · ${r.platform}: `), document.createTextNode(r.action));
    li.append(img(r.key, 28), t); todo.append(li);

  // Microsoft Store + Edge Add-ons each sit together, apps and extensions mixed.
  const groupOf = byStore ? (r) => VENDOR[r.store] || r.store : (r) => r.product;
  const groups = [...new Set(rows.map(groupOf))];
  if (byStore) groups.sort((a, b) => VENDOR_ORDER.indexOf(a) - VENDOR_ORDER.indexOf(b));
  for (const g of groups) {

      const nm = el('div', 'plat-name');

      else nm.append(document.createTextNode(r.platform + ' '), el('span', null, '· ' + r.store));
      const [pc, pt] = PILL[r.status] || ['wait', r.status];
      h.append(nm, el('span', 'pill ' + pc, pt));
      const steps = el('div', 'steps');
      steps.append(
        step('У пользователей', r.live, r.status === 'свежая' ? 'live' : ''), el('span', 'arrow', '←'),
        step('В тесте', r.testing, r.status === 'ждёт прода' || r.status === 'на проверке' ? 'hot' : ''), el('span', 'arrow', '←'),

      const links = el('div', 'links');

       link(r.console_url, 'Кабинет'), link(r.repo_url && r.repo_url + '/issues', 'GitHub issues'), link(r.repo_url, 'GitHub')]
        .forEach((a) => a && links.append(a));

let auth = null;
function loadScript(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.append(s); }); }

  await loadScript('https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js');
  // Its own Firebase app, so its login is kept apart from the site's: a sign-out on dhamma.gift (or the sync's "session
  // ended" sign-out) shared the default app's login and threw the owner out of this page. Kept in the browser until "Выйти".
  const fb = firebase.apps.find((a) => a.name === 'apps') || firebase.initializeApp(cfg, 'apps');
  auth = fb.auth();
  await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

}

  document.getElementById('gate-msg').textContent = msg;

function apkLink(url) {
  const m = url && /\/actions\/runs\/\d+\/artifacts\/(\d+)/.exec(url);
  if (!m) return link(url, 'Скачать APK', 'get');
  const a = link(url, 'Скачать APK', 'get');
  a.addEventListener('click', async (e) => {
    e.preventDefault();
    const label = a.textContent; a.textContent = 'Скачиваю…';
    try {
      const r = await api('/api/apps-apk/' + m[1]);
      if (!r.ok) throw new Error(r.status);
      const name = (/filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '') || [])[1] || 'app.apk';
      const href = URL.createObjectURL(await r.blob());
      const save = document.createElement('a'); save.href = href; save.download = name; document.body.append(save); save.click(); save.remove();
      setTimeout(() => URL.revokeObjectURL(href), 60000);
      a.textContent = label;
    } catch (err) { a.textContent = 'Не скачалось (' + err.message + ')'; setTimeout(() => (a.textContent = label), 4000); }
  });
  return a;
}

        const row = el('div', 'node'); row.append(roleChip(n.role));
        if (n.status) row.append(statusDot(n.status));
        c.append(itemBox({ name: srv.title, what: srv.note, icon: srv.icon, color: srv.color, note: n.note }, row));
      }
      const links = el('div', 'links'); const a = link(ep.url, 'Открыть'); if (a) { links.append(a); c.append(links); }
      grid.append(c);
    }
    return;
  }
  const mon = hub.monitoring || {};
  for (const srv of servers) {
    const c = card(srv);
    // Live numbers from Beszel and this server's process heartbeats from Gatus (both on odg), when they are there.
    const m = (mon.servers || {})[srv.id];
    if (m) {
      const box = el('div', 'metrics');
      const metric = (l, v, cls) => { const x = el('div', 'metric' + (cls ? ' ' + cls : '')); x.append(el('span', 'l', l), el('span', 'v', v)); box.append(x); };
      metric('Состояние', m.status === 'up' ? 'в сети' : m.status, m.status === 'up' ? '' : 'bad');
      if (m.cpu != null) metric('CPU', Math.round(m.cpu) + ' %', m.cpu > 85 ? 'hot' : '');
      if (m.mem != null) metric('Память', Math.round(m.mem) + ' %', m.mem > 85 ? 'hot' : '');
      if (m.disk != null) metric('Диск', Math.round(m.disk) + ' %', m.disk > 90 ? 'bad' : m.disk > 80 ? 'hot' : '');
      if (m.load) metric('Нагрузка', m.load.map((x) => x.toFixed(2)).join(' '));
      if (m.uptime_h != null) metric('Работает', m.uptime_h >= 48 ? Math.round(m.uptime_h / 24) + ' дн.' : m.uptime_h + ' ч');
      c.append(box);
    }
    const procs = (mon.checks || []).filter((x) => x.group === srv.id + ' processes');
    if (procs.length) {
      const pb = el('div', 'procs');
      procs.forEach((x) => { const sp = el('span', x.ok ? '' : 'down', x.name); sp.title = x.ok ? 'работает' : (x.error || 'не отвечает'); pb.append(sp); });
      c.append(pb);
    }
    for (const ep of endpoints) {
      for (const n of (ep.nodes || []).filter((x) => x.server === srv.id)) {
        const row = el('div', 'node'); row.append(roleChip(n.role));
        if (n.status) row.append(statusDot(n.status));
        c.append(itemBox({ ...ep, status: null, note: n.note || ep.note }, row));
      }
    }
    (srv.items || []).forEach((it) => c.append(itemBox(it)));
    grid.append(c);
  }
}
// The map screen: a Mermaid diagram kept in hub.json, drawn by the Mermaid library (loaded only when this screen opens).
let mermaidReady = null;
async function renderMap(sc, grid) {
  const card = el('article', 'card map'); grid.append(card);
  card.append(el('p', 'meta', 'Рисую карту…'));
  try {
    mermaidReady = mermaidReady || loadScript('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js');
    await mermaidReady;
    const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict', flowchart: { htmlLabels: true } });
    const { svg } = await mermaid.render('hubmap' + Date.now(), sc.mermaid);
    card.innerHTML = svg;
  } catch (e) { card.replaceChildren(el('p', 'errs', 'Карта не нарисовалась: ' + e.message)); }
}
function renderHub(sc) {
  const meta = document.getElementById('hub-meta');
  meta.textContent = (sc.note ? sc.note + ' ' : '') + (hub.checked_at ? `Проверено: ${new Date(hub.checked_at).toLocaleString('ru-RU')}.` : '');
  const ml = (hub.monitoring || {}).links || {};
  if (sc.infra && (ml.beszel || ml.gatus)) {
    meta.append(' Графики: ');
    [link(ml.beszel, 'Beszel (ресурсы)'), link(ml.gatus, 'Gatus (проверки)')].filter(Boolean).forEach((a, i) => { if (i) meta.append(' · '); meta.append(a); });
  }
  const grid = document.getElementById('hub-grid'); grid.replaceChildren();
  document.getElementById('infra-seg').hidden = !sc.infra;
  if (sc.infra) return renderInfra(sc, grid);
  if (sc.mermaid) return renderMap(sc, grid);
  for (const g of sc.groups || []) {
    const card = el('article', 'card');
    const head = el('div', 'prod'); const names = el('div');
    names.append(el('div', 'n', g.title)); if (g.note) names.append(el('div', 'k', g.note));
    head.append(ico(g, true), names); card.append(head);
    for (const it of g.items || []) {
      const box = el('div', 'item'); const h = el('div', 'item-head');
      const nm = el('div', 'item-name'); const tx = el('div', null, (it.name || '') + ' ');
      if (it.what) tx.append(el('span', null, '· ' + it.what));
      nm.append(ico(it), tx);
      h.append(nm);
      if (it.status) {
        const st = it.status;
        h.append(el('span', 'dot ' + (st.ok ? 'up' : 'down'), st.ok ? `работает · ${st.ms} мс` : `не отвечает${st.code ? ' (' + st.code + ')' : st.error ? ' (' + st.error + ')' : ''}`));
      }
      box.append(h);
      const facts = [['Где', it.where], ['Аккаунт', it.account], ['Вход / 2FA', it.login], ['Продление', it.renew], ['Заметка', it.note]].filter((f) => f[1]);
      if (facts.length) {
        const dl = el('dl', 'facts');
        facts.forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v)));
        box.append(dl);
      }
      const links = el('div', 'links');
      [link(it.url, 'Открыть'), ...(it.links || []).map((x) => link(x.url, x.title))].forEach((a) => a && links.append(a));
      if (links.children.length) box.append(links);
      card.append(box);
    }
    grid.append(card);
  }
}
// Footer: every link in hub.json on every screen, one column per screen (owner: the links at the bottom were handy).
function paintFooter() {
  const sec = document.getElementById('common-sec'), common = document.getElementById('common');
  common.replaceChildren();
  for (const sc of (hub && hub.screens) || []) {
    const seen = new Set(), rows = [];
    const add = (o, url, title) => { if (url && /^https:\/\//.test(url) && !seen.has(url)) { seen.add(url); rows.push([o, url, title]); } };
    const each = (o) => { add(o, o.url, o.name || o.title); (o.links || []).forEach((x) => add(o, x.url, (o.name ? o.name + ' · ' : '') + x.title)); };
    (sc.groups || []).forEach((g) => (g.items || []).forEach(each));
    if (sc.infra) { (sc.infra.endpoints || []).forEach(each); (sc.infra.servers || []).forEach((x) => (x.items || []).forEach(each)); }
    if (!rows.length) continue;
    const col = el('div'); col.append(el('h3', null, (sc.icon ? sc.icon + ' ' : '') + sc.title)); const ul = el('ul');
    rows.forEach(([o, url, title]) => { const a = link(url, ''); a.append(ico(o), document.createTextNode(title)); const li = el('li'); li.append(a); ul.append(li); });
    col.append(ul); common.append(col);
  }
  sec.hidden = !common.children.length;
}
window.redrawMap = () => { if (screen === 'map' && hub) paintTabs(); };
window.addEventListener('hashchange', () => { screen = location.hash.slice(1) || 'apps'; paintTabs(); });
screen = location.hash.slice(1) || 'apps';
async function loadHub() {
  const r = await api('/api/hub').catch(() => null);
  hub = r && r.ok ? await r.json() : null;
  paintTabs();
  paintFooter();
}

let lastGenerated = '';
async function load() {
  const r = await api('/api/apps-status');
  if (r.status === 403) {
    const j = await r.json().catch(() => ({}));
    return showGate(`Адреса ${j.email || 'этого аккаунта'} нет в списке доступа. Войдите другим аккаунтом.`);
  }
  if (r.status === 404) return showGate('Данных пока нет: джоба Store status ещё ни разу не отработала.');
  if (!r.ok) return showGate('Не удалось получить данные (' + r.status + '). Попробуйте обновить страницу.');
  const data = await r.json();
  document.getElementById('gate').hidden = true; document.getElementById('board').hidden = false;
  render(data);
  paintTabs();
  if (!hub) loadHub();
  return data;
}
document.getElementById('login').addEventListener('click', () => auth && auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(() => {}));
document.getElementById('logout').addEventListener('click', () => auth && auth.signOut());
document.getElementById('refresh').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Обновляю… (1–3 мин)';
  const before = (await load())?.generated_at || '';
  await api('/api/apps-status/refresh', { method: 'POST' });
  // Poll until the new status lands (the job takes about a minute), give up after 6 minutes.
  for (let i = 0; i < 24; i++) {
    await new Promise((ok) => setTimeout(ok, 15000));
    const d = await load();
    if (d && d.generated_at !== before) break;
  }
  btn.disabled = false; btn.textContent = 'Обновить из магазинов';
});
boot().catch(() => showGate('Не загрузился вход через Google. Обновите страницу.'));
</script>
