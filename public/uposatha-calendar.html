<aside id="dg-drawer" hidden aria-label="Menu" data-i18n-aria-label="{{toolbar.menuAriaLabel}}">
  <div class="dg-drawer-head">
    <!-- Шапка шторки ведёт на главную — пункт «Главная» ушёл вместе с «Навигацией», а домой
         из выдачи/ридера через бургер всё равно нужно уметь. -->
    <a class="dg-brand-link" href="/"><img class="dg-brand-logo" src="/assets/img/dgsanhkalogo.png" alt=""><span class="dg-brand-name">dhamma.gift</span></a>
    <button type="button" class="dg-icon-btn dg-drawer-close" aria-label="Close" data-i18n-aria-label="{{global.common.close}}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="dg-drawer-body">
    <!-- Значки у пунктов проставляет home.js (data-dg-icon → FontAwesome.icon), чтобы набор был
         тот же, что у плиток и в боевом меню, и не разъезжался при правках. -->
    <!-- «Найти на странице» — первой строкой, одно место на весь сайт (бургер один и тот же на
         главной/в выдаче/в ридере/в оглавлении). Открывает dg-page-find-ui.js (клик слушает сам
         этот файл, closeDrawer перед открытием — см. там же). Ctrl/Cmd+Shift+F делает то же
         самое (Shift обязателен — голый Ctrl/Cmd+F в реальном Chrome уходит в системный поиск
         браузера раньше, чем страница успевает его перехватить). data-dg-icon="magnifier" — тот
         же ключ ICONS в home.js, что уже даёт fas/magnifying-glass; "magnifying-glass" здесь не
         матчился ни с одним ключом и молча падал на ICONS.external (стрелка). Owner asked for a
         page+magnifying-glass icon specifically ("листик с лупой") — FA6 Free doesn't ship that
         one (file-magnifying-glass/file-search is Pro-only, checked node_modules directly), so
         this stays the plain lens rather than a hand-drawn substitute breaking the icon system's
         "every drawer icon comes from ICONS/FontAwesome" convention. -->
    <a class="dg-drawer-row dg-find-open" href="javascript:void(0)" data-dg-icon="magnifier">{{menu.findOnPage}}</a>
    <!-- Мультитул вместо «Навигации» (owner, 2026-09-05): список плиток главной, чтобы мультитул
         был под рукой в любом месте сайта — в выдаче, в ридере, в TOC. Нативный <details>, свёрнут
         по умолчанию в выдаче/ридере/TOC; на главной openDrawer() (home.js) раскрывает его при
         каждом открытии бургера (owner, 2026-09-06, как в макете). Список строит
         home.js renderDrawerTiles() из тех же menu-links.json / tileOrder() / hiddenTiles(), что и
         плитки; клик по строке = клик по плитке (мегаменю на десктопе, шторка на телефоне). -->
    <details class="dg-drawer-group" id="dg-drawer-multitool">
      <summary class="dg-group-title">{{menu.multitool}}</summary>
      <div id="dg-drawer-tiles"></div>
    </details>
    <!-- Режимы чтения — только в состоянии ридера (owner: "выводи первым делом режимы ридера" —
         протестировать/переключить их иначе можно было только руками через ?mode= в адресе).
         Список строит home.js (paintReaderModes) из reader/mode-table.json — тот же источник
         правды, что уже питает панель переключения режимов внутри самого текста (scLink,
         megareader.js), никакой второй копии режимов здесь не заводится.
         <details>, не голый <div> — owner: "сделай режимы чтения сворачиваемыми... запомнить что
         свёрнуто", тем же native-элементом, что уже здесь для «Мультитул» ниже. Открыт/закрыт
         запоминается в localStorage (paintReaderModes/wireReaderModesToggle, home.js) — читается
         только при показе секции, а не при каждой перерисовке списка внутри неё. -->
    <details id="dg-drawer-modes" hidden>
      <summary class="dg-group-title">{{menu.readingModes}}</summary>
      <div id="dg-drawer-modes-list"></div>
    </details>

    <p class="dg-group-title">{{menu.settings}}</p>
    <!-- Язык/тема — переехали сюда, в «Настройки» (просьба владельца: часть настроек была вверху
         шторки, часть внизу — всё в одном месте). Переключатели наполняет и обслуживает home.js,
         контейнеры БЕЗ класса .dg-segmented (сам переключатель — <div class="dg-segmented">,
         который создаёт segmented() и кладёт сюда). -->
    <p class="dg-group-title" data-dg-icon="language">{{menu.language}}</p>
    <div id="dg-lang-seg"></div>
    <!-- Значка у этого заголовка нет намеренно: солнце рядом со словом «Тема» читалось бы как
         «сейчас светлая». Значки тем — внутри самого переключателя, у своих вариантов. -->
    <p class="dg-group-title">{{menu.theme}}</p>
    <div id="dg-theme-seg"></div>
    <!-- "Описания кнопок" (dgTileDesc) moved to /settings/ — owner: "очень неважная настройка",
         doesn't need to sit in the quick-access drawer next to language/theme. tileDescEnabled()
         in home.js still reads the same localStorage key when actually rendering tile rows. -->

    <!-- Полные настройки (шестерёнка) — ниже язык/тему по просьбе владельца: сначала быстрые
         переключатели, потом ссылка на полную страницу настроек. -->
    <p class="dg-group-title" id="d-uset" data-t="gUposatha"></p>
    <div class="loc-off"><p class="dg-drawer-subtitle" data-t="tz"></p>
    <select class="dg-field-input" id="tz"></select></div>
    <div class="loc-off">

      <div class="dg-segmented" id="hemiseg"><button type="button" data-hemi="north" data-t="north"></button><button type="button" data-hemi="south" data-t="south"></button></div>
    </div>
    <p class="dg-drawer-subtitle" data-t="loc"></p>
    <div class="dg-uset-row loc-off"><button class="dg-field-btn" type="button" id="loc-btn"><span data-t="myLoc"></span></button><input class="dg-field-input" id="city" list="cities" data-tp="city"></div>
    <datalist id="cities"></datalist>
    <p class="dg-uset-note" id="locnote"></p>
    <p class="dg-drawer-subtitle" id="bysuttas-lb" data-t="bySuttas"></p>
    <div class="dg-segmented" id="sw-sut"><button type="button" data-v="1" data-t="on"></button><button type="button" data-v="0" data-t="off"></button></div>
    <p class="dg-drawer-subtitle" data-t="detail"></p>
    <div class="dg-segmented" id="sw-det"><button type="button" data-v="1" data-t="on"></button><button type="button" data-v="0" data-t="off"></button></div>
    <p class="dg-drawer-subtitle" data-t="remind"></p>
