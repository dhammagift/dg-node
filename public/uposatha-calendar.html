<header class="tbar"><div class="in">
  <a class="wordmark" href="/" id="wordmark"><img src="/assets/img/dgsankhaonly.png" alt=""><b>Uposatha</b><span data-t="tag"></span></a>
  <form class="hsearch" id="hsearch" action="/" autocomplete="off" role="search">
    <input id="paliauto" name="q" type="search" data-tp="searchPh" enterkeyhint="search" spellcheck="false" autocapitalize="off">
    <button type="submit" data-tt="searchGo"><svg class="ic"><use href="#i-search"/></svg></button>
  </form>
  <div class="hbtns">
    <button class="rb" type="button" id="b-compass" data-tt="compass" onclick="if (window.toggleQuickModal) window.toggleQuickModal();"><svg class="ic"><use href="#i-compass"/></svg></button>

    <button class="rb" type="button" id="b-menu" data-tt="menu"><svg class="ic"><use href="#i-menu"/></svg></button>
  </div>

<main class="page">
  <div class="intro">
    <h1 data-t="h1"></h1>
    <p><span data-t="lead"></span> <a href="#keys" id="to-keys" data-t="suttas"></a></p>
  </div>

  <section class="today" aria-live="polite">
    <span id="t-moon"></span>
    <div>
      <p class="k" data-t="today"></p>
      <p class="d" id="t-date"></p>
      <p class="ph" id="t-phase"></p>
      <div class="st" id="t-status"></div>
      <p class="sun" id="t-sun"></p>
    </div>
  </section>
  <p class="ctx"><span id="ctx-place"></span><span class="dot">·</span><span id="ctx-mode"></span><span class="dot">·</span><button type="button" id="ctx-change" data-t="change"></button></p>

  <section class="slides" id="slides" hidden>
    <div class="sl-head"><h2 class="eyebrow" data-t="slTitle"></h2><button type="button" class="sl-all" id="sl-all-btn" data-t="showAll"></button></div>
    <div class="sl-box">
      <button class="sl-arw" type="button" id="sl-prev" data-tt="prev"><svg class="ic"><use href="#i-left"/></svg></button>
      <div class="sl-item" id="sl-item">
        <span class="plate" id="sl-plate"></span>
        <p class="sl-pli pli-lang" id="sl-pli" lang="pi"></p>
        <p class="sl-tr" id="sl-tr"></p>
        <a class="sl-cite" id="sl-cite" target="_blank" rel="noopener"></a>
      </div>
      <button class="sl-arw next" type="button" id="sl-next" data-tt="next"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
    <div class="sl-dots" id="sl-dots"></div>
  </section>

  <div class="segrow vtabs" role="tablist">
    <button type="button" aria-pressed="true" id="tab-list"><svg class="ic"><use href="#i-list"/></svg><span data-t="tList"></span></button>
    <button type="button" aria-pressed="false" id="tab-cal"><svg class="ic"><use href="#i-cal"/></svg><span data-t="tCal"></span></button>
  </div>

  <section class="screen" id="s-list"><div id="list"></div><div class="more"><button type="button" id="more" data-t="more"></button></div></section>

  <section class="screen" id="s-cal">
    <div class="calh">
      <h2 id="cal-title"></h2>
      <button class="td" type="button" id="cal-today" data-t="todayBtn"></button>
      <button class="rb" type="button" id="cal-prev" data-tt="prev"><svg class="ic"><use href="#i-left"/></svg></button>
      <button class="rb" type="button" id="cal-next" data-tt="next"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="parts" id="parts">
    <h2 data-t="pH"></h2>
    <p class="sub" data-t="pSub"></p>
    <div class="pgrid" id="pgrid"></div>
  </section>

  <section class="keys" id="keys">
    <h2 data-t="kH"></h2>
    <p class="sub" data-t="kSub"></p>
    <ol id="keylist"></ol>
    <div class="reader" id="reader" hidden>
      <div class="rh"><span><span data-t="kNow"></span>: <b id="rd-now"></b></span><span class="sp"></span><a href="#" id="rd-new" target="_blank" rel="noopener"><svg class="ic"><use href="#i-ext"/></svg><span data-t="kNew"></span></a><select class="sel" id="rd-sel"></select><button class="rb" type="button" id="rd-close" data-tt="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
      <iframe id="rd-frame" title="Sutta" loading="lazy"></iframe>
    </div>
  </section>
</main>
