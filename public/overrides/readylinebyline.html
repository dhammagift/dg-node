        fetch('/read/js/ranges.js')
            .then(response => response.text())
            .then(data => {
                // Извлечение переменных из текста файла
                // ranges.js sets window.<name> = [...] now (it used to be `let <name> = [...]`).
                const regex = /(?:let\s+|window\.)(\w+)\s*=\s*\[([\s\S]*?)\];/g;
                let match;
                let variables = {};

                while ((match = regex.exec(data)) !== null) {
                    variables[match[1]] = match[2].replace(/\s+/g, '').split(',').map(v => v.replace(/^['"]|['"]$/g, ''));
                }

       const vinayaList = document.getElementById('vinayaRanges');
