<style>

:root[data-theme="dark"] { --bg:#12141a; --surface:#1b1e26; --ink:#eef0f5; --ink-2:#b4bac8; --ink-3:#8a91a2; --line:#2c303b; --accent:#8c9bff; --accent-soft:#252b4a; --hl:#4a3f12; color-scheme:dark; }

.col { flex:0 0 min(440px, 92vw); scroll-snap-align:start; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; max-height:calc(100vh - 150px); overflow-y:auto; }
.col h2 { margin:0 0 2px; font-size:18px; } .col .meta { color:var(--ink-3); font-size:12px; margin-bottom:8px; }

details.def > summary .qprev { font-family:Literata, Georgia, serif; font-size:15px; color:var(--ink-2); margin:-4px 0 4px 18px; }
details.def[open] > summary .qprev { display:none; }

.def .src .by { margin-left:auto; color:var(--ink-3); font-size:12px; }

.par .pi { font-family:Literata, Georgia, serif; font-size:16px; line-height:1.65; margin:0; }

.par.q .pi, .par.q .tl { font-weight:600; color:var(--ink); }
.src { font-size:12px; color:var(--ink-3); } .src a { color:var(--accent); text-decoration:none; } .src a:hover { text-decoration:underline; }
.q { font-weight:600; } .seg { margin:2px 0; font-family:Literata, Georgia, serif; font-size:16px; line-height:1.6; }
.src { margin-bottom:2px; } .src a.ref { font-weight:600; color:var(--accent); } .src .ttl { color:var(--ink-3); }

.none { color:var(--ink-3); font-size:13px; }
header .top { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; } h1 small { font-size:15px; font-weight:400; color:var(--ink-2); }

#mind { display:none; }
@media (min-width: 900px) {
  #cols { display:none; }

  #map { background:var(--surface); border:1px solid var(--line); border-radius:12px; height:calc(100vh - 170px); min-height:480px; overflow:hidden; position:relative; }

}

.node.sel text { font-weight:600; } .node.sel circle { stroke-width:3.5px; }
.node .cnt { font:11px system-ui; fill:var(--ink-3); }
.link { fill:none; stroke-width:1.5px; stroke-opacity:.4; }
</style></head><body>

document.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = L[e.dataset.i]; });
document.addEventListener('click', e => {

  }).join('');
}
const TR_NAME = { o: 'o', 'sv+edited+o': 'sv', sv: 'sv', thanissaro: 'Thanissaro', sujato: 'Sujato', brahmali: 'Brahmali' };
const trHtml = seg => { const t = TR && seg[2] && seg[2][TR]; return t ? `<div class="tr">${esc(t[1])} <span class="trby">${esc(TR_NAME[t[0]] || t[0])}</span></div>` : ''; };
function paintTr() { document.querySelectorAll('[data-tr]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tr === TR))); }
// terms that are not doctrine here: generic words, names and forms of address the question formula happens to catch
const SKIP = new Set(['dhamm', 'adhamm', 'atth', 'anatth', 'sādh', 'asādh', 'ariy', 'anariy', 'ekadhamm', 'hot', 'seyy', 'sat', 'sāt', 'rādh',
  'kevaṭṭ', 'dhanañjān', 'dev', 'bho', 'bho gotam', 'cānand', 'ānand', 'tv', 'gant', 'sot', 'brāhmaṇ', 'samaṇ', 'kalyāṇ', 'pāp', 'puggal', 'saddh', 'saddhamm']);
const SHORT_OK = new Set(['jāt', 'jar', 'sok']); // three-letter stems that are real terms
const TRUTHS = [['dukkh ariyasacc', 'Dukkha'], ['dukkhasamuday ariyasacc', 'Samudaya'], ['dukkhanirodh ariyasacc', 'Nirodha'], ['dukkhanirodhagāmin paṭipad ariyasacc', 'Magga']];

}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function searchColumn(stem) {

  cols.replaceChildren(rootColumn(), ...stack.map(k => k[0] === '?' ? searchColumn(k.slice(1)) : column(k)));
  // mark the word that opened each next column
  stack.forEach((k, i) => { const host = cols.children[i]; host.querySelectorAll(k[0] === '?' ? `[data-w="${CSS.escape(k.slice(1))}"]` : `[data-k="${CSS.escape(k)}"]`).forEach(x => x.classList.add('on')); });
  document.getElementById('crumbs').innerHTML = ['<button data-depth="0">' + L.truths + '</button>', ...stack.map((k, i) => `<button data-depth="${i + 1}">${esc(label(k))}</button>`)].join(' › ');
  // the newest column into view (scroll-snap needs the target to be a snap point: its own left edge)
  const last = cols.lastElementChild; setTimeout(() => cols.scrollTo({ left: last.getBoundingClientRect().left - cols.getBoundingClientRect().left + cols.scrollLeft - 16, behavior: first ? 'auto' : 'smooth' }), 50); first = false;
  try { history.replaceState(null, '', '#' + stack.map(encodeURIComponent).join('/')); } catch (e) {}
}
document.addEventListener('click', e => {
  const t = e.target.closest('.t[data-k], .truth[data-k], .w[data-w]'), c = e.target.closest('[data-depth]');
  if (t && t.closest('.col')) { const col = t.closest('.col'); const depth = [...cols.children].indexOf(col); stack.length = depth; stack.push(t.dataset.k || '?' + t.dataset.w); render(); }
  else if (c) { stack.length = +c.dataset.depth; render(); }
});
stack.push(...location.hash.slice(1).split('/').map(decodeURIComponent).filter(k => DATA[k] || (k[0] === '?' && k.length > 3)));

/* ---------- desktop: mind map + reading panel ---------- */
const wide = matchMedia('(min-width: 900px)');
const TCOL = ['#c45a3c', '#b8862a', '#2f8f6b', '#3d6fb8'];
const tree = { key: null, name: 'cattāri ariyasaccāni', open: true, children: TRUTHS.map(([k, n], i) => ({ key: k, name: n, ti: i, open: false })) };
let selected = tree, mapSvg, mapG, linkG, nodeG, zoomer;
function kidsOf(node, path) {
  if (!node.kids) node.kids = termsOf(node.key).filter(k => !path.includes(k)).slice(0, 14).map(k => ({ key: k, name: DATA[k].phrase, ti: node.ti, open: false }));
  return node.kids;
}
function pathOf(node) { const p = []; let n = node; while (n) { if (n.key) p.push(n.key); n = n.parent; } return p; }
function visible(node, parent) {
  node.parent = parent;
  const out = { node, children: [] };
  if (node.open) { const kids = node === tree ? node.children : kidsOf(node, pathOf(node)); out.children = kids.map(k => visible(k, node)); }
  return out;
}
function drawMap(focusNode) {
  const h = d3.hierarchy(visible(tree, null), d => d.children);
  d3.tree().nodeSize([44, 250]).separation((a, b) => a.parent === b.parent ? 1 : 1.3)(h);
  const color = d => d.data.node.ti == null ? 'var(--ink-3)' : TCOL[d.data.node.ti];
  linkG.selectAll('path.link').data(h.links(), d => pathOf(d.target.data.node).join('/')).join('path').attr('class', 'link')
    .attr('stroke', d => color(d.target)).attr('d', d3.linkHorizontal().source(d => ({ x: d.source.x, y: d.source.y + 8 })).x(d => d.y).y(d => d.x));
  const g = nodeG.selectAll('g.node').data(h.descendants(), d => pathOf(d.data.node).join('/') || 'root').join(enter => {
    const e = enter.append('g').attr('class', 'node');
    e.append('circle').attr('r', 7); e.append('text').attr('dy', '0.32em'); e.append('text').attr('class', 'cnt').attr('dy', '1.7em');
    return e;
  });
  g.attr('transform', d => `translate(${d.y},${d.x})`).classed('sel', d => d.data.node === selected)
    .on('click', (e, d) => select(d.data.node, true));
  g.select('circle').attr('stroke', color).attr('fill', d => {
    const n = d.data.node; const hasKids = n === tree || (n.key && (n.kids ? n.kids.length : termsOf(n.key).length));
    return hasKids && !n.open ? color(d) : 'var(--surface)';
  });
  g.select('text:not(.cnt)').attr('x', 12).text(d => d.data.node.name);
  g.select('text.cnt').attr('x', 12).text(d => d.data.node.key ? DATA[d.data.node.key].defs.length + ' ' + L.defsShort + ' · ' + [...new Set(DATA[d.data.node.key].defs.map(x => refName(x.s)))].slice(0, 3).join(', ') : '');
  if (focusNode) { // the chosen node at a third of the width, its branch opening to the right
    const t = h.descendants().find(d => d.data.node === focusNode); const box = document.getElementById('map');
    if (t) { const k = d3.zoomTransform(mapSvg.node()).k || 1; mapSvg.transition().duration(500).call(zoomer.transform, d3.zoomIdentity.translate(box.clientWidth * 0.32 - t.y * k, box.clientHeight / 2 - t.x * k).scale(k)); } }
}
function select(node, toggle) {
  if (toggle && node === selected) node.open = !node.open; else node.open = true;
  selected = node;
  const p = document.getElementById('panel');
  p.replaceChildren(node.key ? column(node.key) : rootColumn());
  drawMap(node);
  const keys = pathOf(node).reverse();
  try { history.replaceState(null, '', '#' + keys.map(encodeURIComponent).join('/')); } catch (e) {}
  document.getElementById('crumbs').innerHTML = [L.truths, ...keys.map(k => esc(DATA[k].phrase))].join(' › ');
}
function initMap() {
  const box = document.getElementById('map');
  mapSvg = d3.select(box).insert('svg', ':first-child');
  mapG = mapSvg.append('g'); linkG = mapG.append('g'); nodeG = mapG.append('g'); // lines under the labels
  zoomer = d3.zoom().scaleExtent([0.3, 2.5]).on('zoom', e => mapG.attr('transform', e.transform));
  mapSvg.call(zoomer).call(zoomer.transform, d3.zoomIdentity.translate(40, box.clientHeight / 2));
  // panel clicks: a blue word opens that branch under the selected node; the truth buttons open their branch
  document.getElementById('panel').addEventListener('click', e => {
    const w = e.target.closest('.w[data-w]');
    if (w) { e.stopImmediatePropagation(); const p = document.getElementById('panel'); const back = p.firstElementChild; const sc = searchColumn(w.dataset.w);
      const b = document.createElement('button'); b.className = 'truth'; b.style.marginBottom = '8px'; b.textContent = '← ' + (selected.key ? DATA[selected.key].phrase : L.truths);
      b.onclick = () => p.replaceChildren(back); sc.prepend(b); p.replaceChildren(sc); return; }
    const t = e.target.closest('.t[data-k], .truth[data-k]'); if (!t) return;
    e.stopImmediatePropagation();
    const k = t.dataset.k;
    const parent = selected === tree ? tree : selected;
    const list = parent === tree ? tree.children : kidsOf(parent, pathOf(parent));
    let child = list.find(c => c.key === k);
    if (!child) { child = { key: k, name: DATA[k].phrase, ti: parent.ti, open: false }; list.push(child); }
    parent.open = true; select(child);
  }, true);
  // open the path of a shared link
  let node = tree;
  for (const k of stack) { if (k[0] === '?') break; node.open = true; const list = node === tree ? tree.children : kidsOf(node, pathOf(node)); let c = list.find(x => x.key === k); if (!c) { c = { key: k, name: DATA[k].phrase, ti: node.ti, open: false }; list.push(c); } node = c; }
  select(node);
}
paintTr();
document.querySelector('.seg-tr').addEventListener('click', e => {
  const b = e.target.closest('[data-tr]'); if (!b) return; TR = b.dataset.tr; try { localStorage.setItem('hatthipadaTr', TR); } catch (er) {} paintTr();
  if (wide.matches) { const p = document.getElementById('panel'); p.replaceChildren(selected.key ? column(selected.key) : rootColumn()); } else render();
});
if (wide.matches) initMap(); else render();
wide.addEventListener('change', () => location.reload());
</script></body></html>
