# Third-party data repos kept as plain mirrors by scripts/update-external-repos.sh (weekly cron).
# One per line: <local path> <git url> <branch>
# A mirror has no local edits and no history: every run resets it to the upstream branch tip
# (depth 1) and drops everything older. Missing paths are cloned the same way.
# Other server: copy this file, change the paths, point EXTERNAL_REPOS_CONF at the copy.
#
# Not listed on purpose: our own dhammagift/* repos (commits happen there), tools that an update
# could break (projectDG/skills/claude-translation-skill, tr-mcp/ai-verify-by-human-translation),
# offline-data/theBuddhasWords (no remote to update from).

/var/www/suttacentral.net/sc-data   https://github.com/suttacentral/sc-data.git   main
/var/www/tipitaka.lk                https://github.com/pnfo/tipitaka.lk.git        main
