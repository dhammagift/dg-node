<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>preview</title>
<link href="/assets/css/styles.css" rel="stylesheet" />
<link href="/assets/css/extrastyles.css" rel="stylesheet" />
<link href="/assets/css/paliLookup.css" rel="stylesheet" />
<link rel="stylesheet" href="/reader/css/index.css">
<link rel="stylesheet" href="/reader/css/rus-multi.css">
<link rel="stylesheet" href="/reader/css/uiextra.css">
<style>
/* Только раскладка контейнера — сам текст красят настоящие таблицы стилей выше, подключённые
   так же, как на search/index.html и reader-template.html. Так образец в /settings/ реально
   показывает, как текст выглядит на проде, а не повторяет их вёрстку заново. */
html, body { margin: 0; padding: 0; background: transparent; }
body { padding: 4px 2px; }
/* #sutta — id ридера (reader/reader-template.html: <div id="sutta" class="sutta">), от него
   зависят реальные стили (reader/css/rus-multi.css #sutta{max-width,line-height} и все
   hide-pali/hide-english/column-view правила) — без него текст был лишь ПОХОЖ на прод, но не
   пользовался теми же CSS-правилами (это и была причина жалобы "не использует стили ридера"). */
.demo-seg { margin-bottom: 14px; }
.demo-seg:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="sutta" class="sutta"></div>
<script>
// Та же самая замена, что reader/megareader.js's window.applyRemovePunct делает на проде —
// скопировано буквально, символ в символ (запятая там БЫЛА в реальном regex, а в этом файле её
// раньше забыли — "убрать пунктуацию" визуально не убирало запятые, хотя в самом ридере всё
// это время работало правильно).
function stripPunct(t) {
  return localStorage.getItem('removePunct') === 'true'
    ? t.replace(/[-—–]/g, ' ').replace(/[:;“”‘’,"']/g, '').replace(/[.?!]/g, ' | ')
    : t;
}
function pickReaderLangs() {
  const raw = localStorage.getItem('dhammaReaderLangs') || localStorage.getItem('dhammaSearchLangs') || 'ru,en';
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}
// Акшарамукха живёт только в Node (не в браузере посетителя) — образец берёт уже готовый,
// заранее сконвертированный набор из settings/demo-data.json (dg-light.js, buildSettingsDemoCache
// считает ISOPali + все SCRIPT_MAP-варианты при старте сервера), не конвертирует сам.
function pickScript() {
  return localStorage.getItem('selectedScript') || 'ISOPali';
}
function currentGroups() {
  const byScript = window.__demoByScript || {};
  return byScript[pickScript()] || byScript.ISOPali || [];
}
// Та же разметка, что генерирует reader/megareader.js в реальном ридере (id сегмента,
// .pli-lang.quote, .right-column с {lang}-lang.quote и .lang-2nd на втором переводчике) —
// только без всей логики путей/режимов/навигации, которая тут не нужна.
function renderSegment(seg, wantedLangs) {
  const anchor = seg.segment.includes(':') ? seg.segment.split(':').slice(1).join(':') : seg.segment;
  let inner = `<span class="pli-lang inputscript-ISOPali quote" lang="pi">${stripPunct(seg.root_text || seg.variant || '')}</span>`;
  const keys = Object.keys(seg.translations);
  const byLang = {};
  keys.forEach(k => {
    const lang = k.split('_')[0];
    (byLang[lang] = byLang[lang] || []).push(k);
  });
  // Раньше здесь было wantedLangs.concat(keys.map(...)) — показывало выбранные языки, а ЗАТЕМ
  // ещё и ЛЮБЫЕ другие языки, какие нашлись в закэшированном демо-сегменте (жалоба "демо
  // показывает en/ru/de, хотя выбрано только ru/en"). Строго только wantedLangs; на другие
  // языки падаем ТОЛЬКО если среди выбранных вообще ничего не нашлось (иначе образец мог бы
  // остаться пустым для языка, которого именно у этого сегмента нет).
  let right = '';
  const langsToRender = wantedLangs.some(l => byLang[l] && byLang[l].length)
    ? wantedLangs
    : wantedLangs.concat(keys.map(k => k.split('_')[0]));
  langsToRender.forEach((lang) => {
    if (!byLang[lang] || !byLang[lang].length) return;
    byLang[lang].forEach((key, idx) => {
      const translatorId = key.split('_').slice(1).join('_');
      const posClass = idx === 0 ? '' : ' lang-2nd';
      right += `<span class="${lang}-lang${posClass} quote" lang="${lang}" data-translator="${translatorId}">${stripPunct(seg.translations[key])}</span>`;
    });
    delete byLang[lang];
  });
  if (right) inner += `<span class="right-column">${right}</span>`;
  // <p>, не <div> — реальный корень бага "чёрное на чёрном" + "не те стили/шрифты": ВСЕ базовые
  // правила цвета и шрифта в rus-multi.css (включая .dark-варианты) заданы через
  // "p .pli-lang"/"p .lang-2nd"/"p,li,h1-h5{color,font-family}" — то есть требуют родителя
  // p/li/dt/dd/h1-h5. Внутри <div><span> эти правила просто никогда не срабатывали: текст
  // наследовал дефолтный цвет/шрифт браузера (тёмный) вместо реального светлого текста для
  // тёмной темы — совпадение с фоном и "не тот шрифт" были СЛЕДСТВИЕМ этого, не отдельными
  // багами.
  return `<p class="demo-seg" id="${anchor}">${inner}</p>`;
}
// Фрагмент выбирается СЛУЧАЙНО РОВНО ОДИН РАЗ — при первой загрузке кадра — и дальше не меняется
// до конца сессии настроек. Любой render() (смена пунктуации, языка, темы, шрифта, письменности,
// кнопка "обновить") перерисовывает ТОТ ЖЕ САМЫЙ фрагмент с новыми стилями. Запоминается sutta_id,
// а не индекс: наборы groups у разных письменностей — разные массивы, и индекс мог указать на
// другую сутту при переключении скрипта.
let currentSuttaId = null;
function render() {
  const groups = currentGroups();
  if (!groups.length) return;
  let group = currentSuttaId ? groups.find(g => g.sutta_id === currentSuttaId) : null;
  if (!group) {
    group = groups[Math.floor(Math.random() * groups.length)];
    currentSuttaId = group.sutta_id;
  }
  const wantedLangs = pickReaderLangs();
  document.getElementById('sutta').innerHTML = group.segments.map(s => renderSegment(s, wantedLangs)).join('');
  // Родительская страница не знает, какой фрагмент сейчас показан (случайный выбор — здесь) —
  // сообщаем sutta_id, чтобы там можно было собрать ссылку "Читать" на настоящий текст.
  window.parent.postMessage({ type: 'dg-preview-current', suttaId: group.sutta_id }, location.origin);
}
// Тема — то же самое, что реально пишет /assets/js/themeswitch.js на проде: body.classList
// 'dark' + <html data-bs-theme="..">, а не просто наш собственный body.dark (от этого зависят
// Bootstrap-переменные --bs-body-bg/--bs-body-color в styles.css) — без этого образец всегда
// выглядел светлым, даже когда сам сайт был в тёмной теме.
function applyTheme() {
  const t = localStorage.getItem('theme') || 'auto';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', dark);
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
}
applyTheme();
const scale = parseInt(localStorage.getItem('uiScale')) || 100;
document.documentElement.style.fontSize = scale + '%';
fetch('/settings/demo-data.json').then(r => r.ok ? r.json() : {}).then(byScript => {
  window.__demoByScript = byScript || {};
  render();
});
window.addEventListener('storage', e => {
  if (['removePunct', 'dhammaReaderLangs', 'dhammaSearchLangs', 'uiScale', 'selectedScript'].includes(e.key)) {
    if (e.key === 'uiScale') document.documentElement.style.fontSize = (parseInt(localStorage.getItem('uiScale')) || 100) + '%';
    render();
  }
  if (e.key === 'theme') applyTheme();
});
window.addEventListener('message', e => {
  // Только refresh: перерисовать текущий фрагмент с актуальными настройками. Пути, меняющего
  // фрагмент, больше нет — он один на всю сессию настроек.
  if (e.data === 'dg-preview-refresh') render();
});
</script>
</body>
</html>
