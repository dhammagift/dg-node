<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhamma Search</title>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    </head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Dhamma.gift</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <form id="searchForm" class="d-flex">
                    <input type="text" id="searchInput" class="form-control me-2" placeholder="Введите слово для поиска...">
                    <button type="submit" id="searchBtn" class="btn btn-primary">Поиск</button>
                </form>
            </div>
        </div>

        <table id="pali" class="table table-striped table-hover mt-3" style="width:100%">
            <thead>
                <tr>
                    <th>Sutta</th>
                    <th>Title</th>
                    <th>Words</th>
                    <th>Ct</th>
                    <th>Mr</th>
                    <th>Links</th>
                    <th>Type</th>
                    <th class="none">Quote</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // Перехватываем отправку формы поиска
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const keyword = document.getElementById('searchInput').value.trim();
            if (keyword) {
                executeGlobalSearch(keyword, 'default');
            }
        });

        // Функция запроса к нашему Node.js API
        async function executeGlobalSearch(keyword, scope = 'default') {
            try {
                // Если тестируешь локально, убедись что порт совпадает. 
                // В продакшене путь будет просто '/search?q='
                const response = await fetch(`http://localhost:3000/search?q=${keyword}&scope=${scope}`);
                
                if (!response.ok) throw new Error("Ошибка сети");
                
                const json = await response.json();
                const dataArray = Object.values(json.data);
                
                renderDataTable(dataArray, keyword);
                
            } catch (error) {
                console.error('Ошибка при поиске:', error);
                alert('Не удалось выполнить поиск. Проверьте соединение с сервером.');
            }
        }

        // Функция отрисовки таблицы DataTables
        function renderDataTable(dataArray, keyword) {
            if ($.fn.DataTable.isDataTable('#pali')) {
                $('#pali').DataTable().clear().destroy();
            }

            const highlightRegex = new RegExp(keyword, 'gi');

            $('#pali').DataTable({
                data: dataArray,
                responsive: true,
                pageLength: 25,
                order: [[4, 'desc']], 
                columns: [
                    {
                        data: 'sutta_id',
                        render: function (data) {
                            return `<a class="fdgLink mainLink" target="_blank" href="/?q=${data}">${data}</a>`;
                        }
                    },
                    {
                        data: 'titles',
                        render: function (data, type, row) {
                            if (!data) return '';
                            let title = data.ru_o || data.ru_sv || data.en_sujato || data.root || row.sutta_id;
                            return `<strong class="pli-lang inputscript-ISOPali">${title}</strong>`;
                        }
                    },
                    {
                        data: 'unique_words',
                        render: function (data) {
                            if (!data || !data.length) return '';
                            return `<span class="pli-lang inputscript-ISOPali">${data.join(', ')}</span>`;
                        }
                    },
                    { data: 'count' },
                    { data: 'mr' },
                    {
                        data: 'sutta_id',
                        orderable: false,
                        render: function (data) {
                            return `<a class="dprLink" target="_blank" href="https://suttacentral.net/${data}/pli/ms">Pi</a>&nbsp;
                                    <a class="bwLink" target="_blank" href="https://suttacentral.net/${data}/en/sujato">En</a>&nbsp;
                                    <a class="ruLink" target="_blank" href="https://suttacentral.net/${data}/ru/o">Ru</a>`;
                        }
                    },
                    { data: 'category' },
                    {
                        data: 'segments',
                        className: 'none',
                        render: function (data) {
                            if (!data || data.length === 0) return '';
                            let quoteHtml = '';

                            data.forEach(seg => {
                                let paliText = seg.root_text || '';
                                let transText = '';

                                if (seg.translations) {
                                    const transKeys = Object.keys(seg.translations);
                                    const ruKey = transKeys.find(k => k.startsWith('ru_'));
                                    const enKey = transKeys.find(k => k.startsWith('en_'));
                                    transText = seg.translations[ruKey] || seg.translations[enKey] || '';
                                }

                                if (paliText) paliText = paliText.replace(highlightRegex, match => `<b class="match finder">${match}</b>`);
                                if (transText) transText = transText.replace(highlightRegex, match => `<b class="match finder">${match}</b>`);

                                quoteHtml += `
                                    <p>
                                        <a target="_blank" class="fdgLink quoteLink text-decoration-none" href="/?q=${seg.segment}">
                                            <span class="pli-lang">${paliText}</span>
                                        </a><br>
                                        <span class="eng-lang text-muted font-weight-light">${transText}</span>
                                    </p>
                                `;
                            });

                            return quoteHtml;
                        }
                    }
                ]
            });
        }
    </script>
</body>
</html>
