name: Generate Standalone DPD
# Locally generates the reader's standalone dictionary files from the DPD database (SBS fork for RU).
# Enhanced with Dhamma.Gift Glossary from dg-docs.

on:
  schedule:
    - cron: '0 21 * * *' # Daily at 21:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest DPD database
        run: |
          set -e
          DB_URL=$(curl -s https://api.github.com/repos/sasanarakkha/dpd-db-sbs/releases/latest | grep "browser_download_url.*dpd.db.tar.xz" | cut -d '"' -f 4)
          echo "Downloading $DB_URL"
          curl -fsSL "$DB_URL" -o dpd.db.tar.xz
          tar -xJf dpd.db.tar.xz

      - name: Fetch latest Glossary (dg-docs)
        run: |
          git clone -q --depth 1 -b dist https://github.com/dhammagift/dg-docs.git dg-docs

      - name: Run generator
        run: |
          mkdir -p output/ru
          python3 scripts/build-standalone-dpd.py . output dpd.db dg-docs/build-ru/glossary/index.html

      - name: Deploy files
        run: |
          DST=public/overrides/js/standalone-dpd
          mkdir -p "$DST/ru"
          cp -v output/dpd_i2h.js "$DST/"
          cp -v output/dpd_ebts.js "$DST/"
          cp -v output/ru/dpd_ebts.js "$DST/ru/"
          cp -v output/dpd_deconstructor.js "$DST/"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/overrides/js/standalone-dpd
          if git diff --cached --quiet; then
            echo "No changes in dictionary files."
            exit 0
          fi
          git commit -m "Standalone DPD: automated generation (DPD SBS + DG Glossary)"
          git push
