name: Build docs

# Builds the Docusaurus docs (dg-docs/, EN at /docs/ and RU at /ru/docs/) on GitHub's runner and
# publishes the static result to the `docs-dist` branch: build/ and build-ru/ at its root.
#
# Why not on the server: dg-docs has no node_modules there, an install plus two builds wants
# ~1GB of RAM, and the box is RAM-tight (prod once went down from memory pressure). The server
# only needs the finished HTML — it takes it from docs-dist with a plain git pull, no Node involved.
#
# Only `pwa` publishes: prod and test both run that branch, and a second source branch writing the
# same docs-dist would overwrite it with other content.

on:
  push:
    branches: [pwa]
    paths:
      - 'dg-docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # dg-docs keeps no package-lock, so `npm ci` cannot run; --no-package-lock keeps it that way.
      - name: Install
        working-directory: dg-docs
        run: npm install --no-package-lock --no-audit --no-fund --loglevel=error

      - name: Build EN
        working-directory: dg-docs
        run: npm run build

      - name: Build RU
        working-directory: dg-docs
        run: npm run build:ru

      - name: Publish to docs-dist
        run: |
          set -e
          SRC_SHA="$(git rev-parse --short HEAD)"
          mkdir -p "$RUNNER_TEMP/dist"
          cp -r dg-docs/build dg-docs/build-ru "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          git init -q -b docs-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs build from pwa ${SRC_SHA}"
          # One commit, force-pushed: the branch is a deploy artifact, not history.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" docs-dist
