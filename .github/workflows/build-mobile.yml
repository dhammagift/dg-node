name: Build Mobile App

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Check mobile directory structure
        run: ls -la mobile/ && ls -la mobile/android/ || echo "Android dir not found"

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: cd mobile && npm ci

      - name: Build offline database
        run: cd mobile && npm run build-offline-db

      - name: Build assets
        run: cd mobile && npm run build-assets

      - name: Build TOC snapshot
        run: cd mobile && npm run build-toc-snapshot

      - name: Sync Capacitor
        run: cd mobile && npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x mobile/android/gradlew

      - name: Build Android Release APK
        run: cd mobile/android && ./gradlew assembleRelease

      - name: List build outputs
        run: find mobile/android -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
