name: Build Mobile App

# Builds mobile/dist/*.db + the Android APK entirely on GitHub's runner — the prod server has no
# disk headroom for this (core.db+lang_ru.db+lang_en.db alone are ~260MB, plus Gradle/Android SDK
# caches).
#
# dg-node has many git-tracked RELATIVE symlinks (reader/images/*.png, reader/css/index.css,
# siteroot/*, ...) that assume the exact prod directory depth:
#   /var/www/html/                    <- dhammagift/dg (legacy PHP repo)
#   /var/www/html/nodejs/             <- dhammagift/dg-node (this repo)
# A relative symlink resolves against the REAL (kernel-canonicalized) path, not any alias on top
# of it — so checking dg-node out to some other location (e.g. a workspace-relative repos/dg-node/)
# and then symlink-ALIASING /var/www/html/nodejs to it does NOT make those relative symlinks
# resolve correctly: Node's readdirSync/copyFileSync/__dirname all see the real underlying path,
# not the alias. Learned this the hard way — reader/images/favicon-name-black.png ->
# ../../../assets/img/read/... and reader/css/index.css -> ../../../read/css/index.css both broke
# "Build assets" with ENOENT until dg and dg-node were checked out DIRECTLY to their real absolute
# prod paths below. No alias needed for either anymore.
#
# sc-data and offline-data don't have this problem: they're referenced only through
# nodejs/siteroot/data/{suttacentral.net,dhammagift}, which this workflow force-replaces with
# hand-made ABSOLUTE symlinks anyway (see "Create symlink structure" below) — independent of
# checkout path depth, so they stay under the workspace-relative repos/ for simplicity.
#
# Checkout order matters: dg (legacy) MUST land first, since dg-node's target is nested inside it
# (/var/www/html/nodejs) — actions/checkout runs `git clean -ffdx` scoped to its own target dir,
# which would otherwise wipe a sibling checkout that arrived first.
#
# All repos are public, so no token needed.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

env:
  REPOS_ROOT: ${{ github.workspace }}/repos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace layout
        run: |
          sudo mkdir -p /var/www/html
          sudo chown -R "$(id -u):$(id -g)" /var/www/html
          mkdir -p "$REPOS_ROOT/sc-data"
          mkdir -p "$REPOS_ROOT/offline-data"

      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory /var/www/html
          git config --global --add safe.directory /var/www/html/nodejs
          git config --global --add safe.directory "$REPOS_ROOT/sc-data"
          git config --global --add safe.directory "$REPOS_ROOT/offline-data"

      # Lands directly at the real prod path (not a workspace-relative alias) — see header comment
      # for why this matters. "read" added alongside assets/* — reader/css/index.css's relative
      # symlink needs /var/www/html/read/css/index.css to exist.
      #
      # actions/checkout@v4 REFUSES any `path:` outside $GITHUB_WORKSPACE ("Repository path
      # '/var/www/html' is not under ...") — no supported override. Plain git commands don't have
      # that restriction, so these two use git directly instead (exact same recipe verified
      # locally against the real GitHub remotes during development of this workflow).
      - name: Checkout legacy dg (assets + read only)
        working-directory: /var/www/html
        run: |
          git init -q
          git remote add origin https://github.com/dhammagift/dg.git
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          git sparse-checkout set assets/img assets/css assets/js assets/svg assets/texts read
          git fetch --depth 1 origin main -q
          git checkout -q FETCH_HEAD

      # Anonymous `git fetch origin <full-sha>` returns HTTP 401 for this repo (GitHub's
      # allowReachableSHA1InWant extension isn't enabled here) — fetch by ref name instead
      # (always in the standard ref advertisement) and verify it landed on the expected commit.
      - name: Checkout dg-node (this repo)
        run: |
          mkdir -p /var/www/html/nodejs
          cd /var/www/html/nodejs
          git init -q
          git remote add origin https://github.com/dhammagift/dg-node.git
          git fetch --depth 1 origin ${{ github.ref }} -q
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" || { echo "::error::checked out $(git rev-parse HEAD), expected ${{ github.sha }}"; exit 1; }

      # structure/tree is NOT optional — dg-light.js's TOC_TREE_ROOT reads
      # .../sc-data/structure/tree/{sutta,vinaya,abhidhamma}/{code}-tree.json for every single
      # /api/toc/book/:code request. Missing it doesn't error at checkout time (sc_bilara_data
      # alone builds a perfectly valid skeleton/offline-db) — every book lookup just 404s at
      # request time instead, which is exactly what silently broke "Build TOC snapshot" 46/46.
      - name: Checkout SuttaCentral bilara data (public, root/variant/html/translation only)
        uses: actions/checkout@v4
        with:
          repository: suttacentral/sc-data
          path: repos/sc-data
          sparse-checkout: |
            sc_bilara_data
            structure
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout DhammaGift offline translations
        uses: actions/checkout@v4
        with:
          repository: dhammagift/offline-data
          path: repos/offline-data
          sparse-checkout: |
            dhammagift
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Create symlink structure for sc-data/offline-data
        run: |
          # NOTE: /var/www/html/suttacentral.net is NOT created here — the legacy dg checkout
          # (previous step) already brought it in as a git-tracked symlink pointing at
          # ../suttacentral.net (dg's root sparse-checkout in cone mode always includes root-level
          # entries, symlinks included, regardless of the sparse-checkout dir list). It resolves to
          # exactly /var/www/suttacentral.net below, so it's already an alias for it — `mkdir -p` on
          # a dangling symlink fails with "File exists" (the directory entry exists even though its
          # target doesn't yet), and a second `ln -s` at the alias path would fail the same way once
          # the target below exists. Only the real target needs creating; the alias resolves through
          # it automatically.
          sudo mkdir -p /var/www/suttacentral.net
          sudo mkdir -p /var/www/offline-data
          sudo mkdir -p /offline-data

          # Remove any existing symlinks to avoid conflicts
          sudo rm -f /var/www/suttacentral.net/sc-data || true
          sudo rm -f /var/www/offline-data/dhammagift || true
          sudo rm -f /offline-data/dhammagift || true

          # SuttaCentral bilara data: dblight.js/dg-light.js/mobile's translation-sources.js all
          # read from .../suttacentral.net/sc-data/sc_bilara_data (the real prod layout has an
          # actual sc-data/ directory there, see nodejs/CLAUDE.md). Symlink the CHECKED-OUT sc-data
          # dir itself (not its sc_bilara_data subfolder) one level up so that "sc-data" segment
          # resolves. /var/www/html/suttacentral.net/sc-data resolves to the same place through the
          # alias described above, so it needs no separate symlink.
          sudo ln -s "$REPOS_ROOT/sc-data" /var/www/suttacentral.net/sc-data

          # Offline translations: place under /var/www/offline-data and also root /offline-data to satisfy different relative links
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /var/www/offline-data/dhammagift
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /offline-data/dhammagift

          sudo chown -R "$(id -u):$(id -g)" /var/www/suttacentral.net /var/www/offline-data /offline-data || true

          # Replace placeholder text-files in the checked-out repo that represent relative symlink
          # targets with real (absolute) symlinks pointing at the locations just created — same
          # treatment prod gives siteroot/data/<site>.
          DG_NODE_DATA=/var/www/html/nodejs/siteroot/data
          echo "Replacing siteroot/data placeholders with symlinks (force)"
          sudo rm -rf "$DG_NODE_DATA/suttacentral.net" || true
          sudo ln -s /var/www/suttacentral.net "$DG_NODE_DATA/suttacentral.net"
          sudo rm -rf "$DG_NODE_DATA/dhammagift" || true
          sudo ln -s /offline-data/dhammagift "$DG_NODE_DATA/dhammagift"
          sudo chown -R "$(id -u):$(id -g)" "$DG_NODE_DATA" || true

          echo "Resolved link for siteroot/data/suttacentral.net:"
          readlink -f "$DG_NODE_DATA/suttacentral.net" || true

      - name: Verify data layout resolves
        working-directory: /var/www/html/nodejs
        run: |
          echo "Checking data layout..."
          test -d siteroot/data/suttacentral.net/sc-data/sc_bilara_data/root || { echo "::error::sc-data did not land where siteroot/data/suttacentral.net/sc-data expects it"; exit 1; }
          test -d siteroot/data/suttacentral.net/sc-data/structure/tree/sutta || { echo "::error::sc-data's structure/tree missing — every /api/toc/book/:code request 404s without it (TOC_TREE_ROOT in dg-light.js)"; exit 1; }
          test -d siteroot/data/dhammagift/translation/en || { echo "::error::offline-data did not land where siteroot/data/dhammagift expects it"; exit 1; }
          test -f /var/www/html/assets/js/textinfo.json || { echo "::error::legacy assets/js missing (textinfo.json) — dblight.js needs it"; exit 1; }
          test -f reader/images/favicon-name-black.png || { echo "::error::reader/images relative symlink didn't resolve — dg and dg-node must be checked out at their real absolute prod paths (see workflow header comment)"; exit 1; }
          test -f reader/css/index.css || { echo "::error::reader/css/index.css relative symlink didn't resolve — needs /var/www/html/read/css/index.css, check dg's sparse-checkout includes 'read'"; exit 1; }
          echo "Data layout OK."
          ls -la siteroot/data/

      - name: Ensure cache directories exist
        run: |
          echo "Preparing cache directories"
          mkdir -p ~/.npm
          mkdir -p ~/.cache/yarn
          mkdir -p /var/www/html/nodejs/node_modules
          mkdir -p /var/www/html/nodejs/mobile/node_modules
          echo "Cache directories ready"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm/yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            /var/www/html/nodejs/node_modules
            /var/www/html/nodejs/mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('/var/www/html/nodejs/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # No `cache: gradle` here: setup-java's built-in gradle-file glob (and the hashFiles()
      # expression function, same restriction) both refuse to look outside $GITHUB_WORKSPACE, even
      # with an absolute pattern — "No file in $GITHUB_WORKSPACE matched" is the hard error, not a
      # silent skip. dg-node is deliberately checked out to the real prod path
      # /var/www/html/nodejs instead (see header comment), which is outside $GITHUB_WORKSPACE, so
      # this can't be satisfied by pointing the glob elsewhere — only by not using it. Gradle just
      # re-downloads its dependencies each run instead of hitting a cache; fine for now, revisit
      # with a manual actions/cache keyed off a hand-computed hash if build time becomes an issue.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Install root dependencies
        working-directory: /var/www/html/nodejs
        run: npm install --legacy-peer-deps --no-audit

      # public/overrides/js/fontawesome-local.js is gitignored (generated from the
      # @fortawesome/fontawesome-free root dependency, see build-icons.js) — a fresh checkout never
      # has it, so mobile/build-assets.js's ASSETS list (which has no legacy fallback for it) always
      # reported it MISSING and exited 1. Needs to run after root deps are installed (reads from
      # node_modules/@fortawesome/fontawesome-free/svgs) and before "Build assets" below.
      - name: Build FontAwesome icon subset
        working-directory: /var/www/html/nodejs
        run: npm run build-icons

      - name: Install mobile dependencies
        working-directory: /var/www/html/nodejs/mobile
        run: npm install --legacy-peer-deps --no-audit

      # Skeleton (dg_db_light.json) is gitignored — each environment builds its own, and
      # build-offline-db.js reads it from the repo root. Needed before build-offline-db AND
      # before dg-light.js can boot for the TOC snapshot step below.
      - name: Build skeleton (dg_db_light.json)
        working-directory: /var/www/html/nodejs
        run: npm run build-db

      - name: Build offline database
        working-directory: /var/www/html/nodejs/mobile
        run: npm run build-offline-db

      # dg-light.js's app.listen() accepts connections immediately, while its async initServer()
      # (buildSettingsDemoCache — Aksharamukha conversion for every script — then
      # buildScriptListCache/buildLangCountsCache/buildTranslatorCatalogCache) keeps running
      # concurrently in the background and writes settings/{scripts,demo-data,lang-counts,
      # translator-catalog}.json only once it's done. Measured locally: /api/toc responds in ~6s,
      # "Build TOC snapshot" (below) finishes by ~16s, but translator-catalog.json — the LAST file
      # in that sequence — doesn't land until ~36s. "Stop dg-light.js" (further below) then kills
      # the process, freezing initServer() wherever it was — so "Build assets" (which needs all 4
      # of those files) failed with some of them permanently missing. Waiting for
      # translator-catalog.json here, not just /api/toc, closes that window.
      - name: Start dg-light.js for TOC snapshot
        working-directory: /var/www/html/nodejs
        run: |
          npm start > /tmp/dg-light.log 2>&1 &
          echo $! > /tmp/dg-light.pid
          echo "Waiting for dg-light.js to start and finish its async init..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/toc > /dev/null 2>&1 && [ -f settings/translator-catalog.json ]; then
              echo "dg-light.js is up and fully initialized on attempt $i."
              exit 0
            fi
            echo "Attempt $i/45..."
            sleep 2
          done
          echo "::error::dg-light.js did not become fully ready within 90s"
          cat /tmp/dg-light.log
          exit 1

      - name: Build TOC snapshot
        working-directory: /var/www/html/nodejs/mobile
        run: npm run build-toc-snapshot

      - name: Stop dg-light.js
        if: always()
        run: |
          if [ -f /tmp/dg-light.pid ]; then
            PID=$(cat /tmp/dg-light.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi

      # MUST run after dg-light.js has started at least once: settings/{scripts,demo-data,
      # lang-counts,translator-catalog}.json are gitignored and generated by dg-light.js at
      # server startup, not committed to git — on a fresh checkout they don't exist until the
      # server has booted once.
      - name: Build assets
        working-directory: /var/www/html/nodejs/mobile
        run: |
          ls -la /var/www/html/nodejs/settings/ | tee /tmp/build-assets-debug.log
          npm run build-assets 2>&1 | tee -a /tmp/build-assets-debug.log
          exit ${PIPESTATUS[0]}
        shell: bash

      # Temporary diagnostic: repo has no admin-scoped log access for this session to debug CI
      # failures with — remove once "Build assets" is confirmed green for a few runs.
      - name: Upload build-assets debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-debug-log
          path: /tmp/build-assets-debug.log
          retention-days: 3

      - name: Sync Capacitor
        working-directory: /var/www/html/nodejs/mobile
        run: npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x /var/www/html/nodejs/mobile/android/gradlew

      # assembleRelease (not used here) has no signingConfig in build.gradle — it would produce
      # app-release-unsigned.apk, not installable without a separate signing step. assembleDebug
      # is auto-signed with the Android debug keystore (no secrets needed) — same command every
      # manual build in this project's history has used (see TODO.md).
      - name: Build Android Debug APK
        working-directory: /var/www/html/nodejs/mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        run: |
          echo "Searching for APK/AAB files..."
          find /var/www/html/nodejs/mobile/android -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"
          ls -lah /var/www/html/nodejs/mobile/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      # Always uploaded (any trigger, including manual workflow_dispatch on a branch) — a manual
      # run that builds a real APK but hands back nothing usable isn't actually working. Downloaded
      # from the run's own Summary page ("Artifacts" section) rather than a GitHub Release.
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /var/www/html/nodejs/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # softprops/action-gh-release hard-requires a tag ref to attach to — a workflow_dispatch run
      # on a branch has none ("⚠️ GitHub Releases requires a tag"), so only attempt this on the
      # mobile-v* tag pushes this workflow is also triggered by (see `on:` above). Manual runs still
      # get their APK via "Upload APK artifact" above.
      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /var/www/html/nodejs/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
