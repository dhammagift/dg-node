name: Build Mobile App

# Builds mobile/dist/*.db + the Android APK entirely on GitHub's runner — the prod server has no
# disk headroom for this (core.db+lang_ru.db+lang_en.db alone are ~260MB, plus Gradle/Android SDK
# caches). Needs 4 repos on disk in the EXACT relative layout mobile/lib/translation-sources.js
# and mobile/build-assets.js expect (see nodejs/CLAUDE.md "Прод: пути и symlinks" — this workflow
# recreates that layout instead of the prod symlink chain, since GH Actions starts from nothing):
#   /var/www/html/                    <- dhammagift/dg (legacy PHP repo) — only assets/ needed
#   /var/www/html/nodejs/             <- dhammagift/dg-node (this repo)
#   /var/www/suttacentral.net/sc-data/  <- suttacentral/sc-data (public)
#   /offline-data/                    <- dhammagift/offline-data — only dhammagift/ subtree needed
# nodejs/siteroot/data/{suttacentral.net,dhammagift} are committed relative symlinks pointing at
# exactly this layout — once the 4 repos land at these paths, no path edits are needed anywhere.
#
# Checkout order matters: dg (legacy) MUST land first, before anything is placed inside its
# subdirectories (dg-node at .../html/nodejs, sc-data at .../suttacentral.net) — actions/
# checkout runs `git clean -ffdx` scoped to its own target dir, which would otherwise wipe a
# sibling checkout that arrived first. offline-data's target is a fully independent tree, order
# doesn't matter for it.
#
# All repos are public, so no token needed.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

env:
  REPOS_ROOT: ${{ github.workspace }}/repos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace layout
        run: |
          mkdir -p "$REPOS_ROOT/dg"
          mkdir -p "$REPOS_ROOT/dg-node"
          mkdir -p "$REPOS_ROOT/sc-data"
          mkdir -p "$REPOS_ROOT/offline-data"

      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory "$REPOS_ROOT/dg"
          git config --global --add safe.directory "$REPOS_ROOT/dg-node"
          git config --global --add safe.directory "$REPOS_ROOT/sc-data"
          git config --global --add safe.directory "$REPOS_ROOT/offline-data"

      # First: lands at workspace/repos/dg
      - name: Checkout legacy dg (assets only)
        uses: actions/checkout@v4
        with:
          repository: dhammagift/dg
          path: repos/dg
          sparse-checkout: |
            assets/img
            assets/css
            assets/js
            assets/svg
            assets/texts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout dg-node (this repo)
        uses: actions/checkout@v4
        with:
          path: repos/dg-node
          fetch-depth: 1

      - name: Checkout SuttaCentral bilara data (public, root/variant/html/translation only)
        uses: actions/checkout@v4
        with:
          repository: suttacentral/sc-data
          path: repos/sc-data
          sparse-checkout: |
            sc_bilara_data
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout DhammaGift offline translations
        uses: actions/checkout@v4
        with:
          repository: dhammagift/offline-data
          path: repos/offline-data
          sparse-checkout: |
            dhammagift
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Create symlink structure at /var/www and expected global locations
        run: |
          # Create both the html and global paths that the repo's committed relative symlinks may point at.
          sudo mkdir -p /var/www/html/suttacentral.net
          sudo mkdir -p /var/www/suttacentral.net
          sudo mkdir -p /var/www/offline-data
          sudo mkdir -p /offline-data

          # Remove any existing symlinks to avoid conflicts
          sudo rm -f /var/www/html/nodejs || true
          sudo rm -f /var/www/html/suttacentral.net/sc_bilara_data || true
          sudo rm -f /var/www/suttacentral.net/sc_bilara_data || true
          sudo rm -f /var/www/offline-data/dhammagift || true
          sudo rm -f /offline-data/dhammagift || true

          # Create symlinks from workspace repos to the locations referenced by the code's relative symlinks
          sudo ln -s "$REPOS_ROOT/dg" /var/www/html/dg-assets
          sudo ln -s "$REPOS_ROOT/dg/assets" /var/www/html/assets
          sudo ln -s "$REPOS_ROOT/dg-node" /var/www/html/nodejs

          # SuttaCentral bilara data: place in both /var/www/html and /var/www so either relative layout works
          sudo ln -s "$REPOS_ROOT/sc-data/sc_bilara_data" /var/www/html/suttacentral.net/sc_bilara_data
          sudo ln -s "$REPOS_ROOT/sc-data/sc_bilara_data" /var/www/suttacentral.net/sc_bilara_data

          # Offline translations: place under /var/www/offline-data and also root /offline-data to satisfy different relative links
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /var/www/offline-data/dhammagift
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /offline-data/dhammagift

          sudo chown -R "$(id -u):$(id -g)" /var/www || true
          sudo chown -R "$(id -u):$(id -g)" /offline-data || true

          # Replace placeholder text-files in the checked-out repo that represent relative symlink targets
          # with real symlinks that point at the locations we just created. This mirrors the production layout
          # where siteroot/data/<site> are actual symlinks.
          DG_NODE_DATA="$REPOS_ROOT/dg-node/siteroot/data"
          if [ -d "$DG_NODE_DATA" ]; then
            echo "Replacing siteroot/data placeholders with symlinks (force)"
            sudo rm -rf "$DG_NODE_DATA/suttacentral.net" || true
            sudo ln -s /var/www/suttacentral.net "$DG_NODE_DATA/suttacentral.net"
            sudo rm -rf "$DG_NODE_DATA/dhammagift" || true
            sudo ln -s /offline-data/dhammagift "$DG_NODE_DATA/dhammagift"
          fi

          # Debug info: show workspace and sc-data contents, and resolve the created symlink
          echo "Workspace repos:"
          ls -la "$REPOS_ROOT" || true
          echo "sc-data contents:"
          ls -la "$REPOS_ROOT/sc-data" || true
          echo "Resolved link for repo siteroot/data/suttacentral.net:"
          readlink -f "$DG_NODE_DATA/suttacentral.net" || true

      - name: Verify data layout resolves
        working-directory: /var/www/html/nodejs
        run: |
          echo "Checking data layout..."
          test -d siteroot/data/suttacentral.net/sc_bilara_data/root || { echo "::error::sc-data did not land where siteroot/data/suttacentral.net expects it"; exit 1; }
          test -d siteroot/data/dhammagift/translation/en || { echo "::error::offline-data did not land where siteroot/data/dhammagift expects it"; exit 1; }
          test -f /var/www/html/assets/js/textinfo.json || { echo "::error::legacy assets/js missing (textinfo.json) — dblight.js needs it"; exit 1; }
          echo "Data layout OK."
          ls -la siteroot/data/

      - name: Ensure cache directories exist
        run: |
          echo "Preparing cache directories"
          mkdir -p ~/.npm
          mkdir -p ~/.cache/yarn
          mkdir -p "$REPOS_ROOT/dg-node/node_modules"
          mkdir -p "$REPOS_ROOT/dg-node/mobile/node_modules"
          echo "Cache directories ready"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Restore npm/yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            repos/dg-node/node_modules
            repos/dg-node/mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('repos/dg-node/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Install root dependencies
        working-directory: /var/www/html/nodejs
        run: npm install --legacy-peer-deps --no-audit

      - name: Install mobile dependencies
        working-directory: /var/www/html/nodejs/mobile
        run: npm install --legacy-peer-deps --no-audit

      # Skeleton (dg_db_light.json) is gitignored — each environment builds its own, and
      # build-offline-db.js reads it from the repo root. Needed before build-offline-db AND
      # before dg-light.js can boot for the TOC snapshot step below.
      - name: Build skeleton (dg_db_light.json)
        working-directory: /var/www/html/nodejs
        run: npm run build-db

      - name: Build offline database
        working-directory: /var/www/html/nodejs/mobile
        run: npm run build-offline-db

      - name: Build assets
        working-directory: /var/www/html/nodejs/mobile
        run: npm run build-assets

      # Skeleton (dg_db_light.json) is gitignored — each environment builds its own, and
      # build-offline-db.js reads it from the repo root. Needed before build-offline-db AND
      # before dg-light.js can boot for the TOC snapshot step below.
      - name: Start dg-light.js for TOC snapshot
        working-directory: /var/www/html/nodejs
        run: |
          npm start > /tmp/dg-light.log 2>&1 &
          echo $! > /tmp/dg-light.pid
          echo "Waiting for dg-light.js to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/toc > /dev/null 2>&1; then
              echo "dg-light.js is up on attempt $i."
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          echo "::error::dg-light.js did not respond on :3000/api/toc within 60s"
          cat /tmp/dg-light.log
          exit 1

      - name: Build TOC snapshot
        working-directory: /var/www/html/nodejs/mobile
        run: npm run build-toc-snapshot

      - name: Stop dg-light.js
        if: always()
        run: |
          if [ -f /tmp/dg-light.pid ]; then
            PID=$(cat /tmp/dg-light.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi

      - name: Sync Capacitor
        working-directory: /var/www/html/nodejs/mobile
        run: npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x /var/www/html/nodejs/mobile/android/gradlew

      # assembleRelease (not used here) has no signingConfig in build.gradle — it would produce
      # app-release-unsigned.apk, not installable without a separate signing step. assembleDebug
      # is auto-signed with the Android debug keystore (no secrets needed) — same command every
      # manual build in this project's history has used (see TODO.md).
      - name: Build Android Debug APK
        working-directory: /var/www/html/nodejs/mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        run: |
          echo "Searching for APK/AAB files..."
          find /var/www/html/nodejs/mobile/android -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"
          ls -lah /var/www/html/nodejs/mobile/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK directory not found"

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /var/www/html/nodejs/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
