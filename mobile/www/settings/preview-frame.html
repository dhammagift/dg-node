<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>preview</title>
<link href="/assets/css/styles.css" rel="stylesheet" />
<link href="/assets/css/extrastyles.css" rel="stylesheet" />
<link href="/assets/css/paliLookup.css" rel="stylesheet" />
<link rel="stylesheet" href="/reader/css/index.css">
<link rel="stylesheet" href="/reader/css/rus-multi.css">
<link rel="stylesheet" href="/reader/css/uiextra.css">
<style>
/* Только раскладка контейнера — сам текст красят настоящие таблицы стилей выше, подключённые
   так же, как на search/index.html и reader-template.html. Так образец в /settings/ реально
   показывает, как текст выглядит на проде, а не повторяет их вёрстку заново.
   ФОН НЕ ПЕРЕОПРЕДЕЛЯЕМ. Раньше здесь стояло background:transparent — из-за этого образец
   показывал фон страницы настроек, а не настоящий фон ридера (rus-multi.css: светлая
   var(--light-off-white), тёмная var(--off-black)), то есть по фону это было не демо. Свои
   у нас только отступы: у ридера body{margin:1rem 3rem}, в узком кадре это съедало ширину. */
html, body { margin: 0; padding: 0; }
body { padding: 4px 2px; }
/* Скрытая копия кнопки словаря из панели ридера (reader-template.html: a.toggle-dict-btn > img).
   paliLookup.js читает её безусловно (`document.querySelector('.toggle-dict-btn img').src = …`)
   и без неё падает с TypeError на первой же строке — то есть словарь в образце не завёлся бы
   вообще. Сама кнопка тут не нужна (вкл/выкл словаря переключается в настройках рядом). */
.dict-shim { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* #sutta — id ридера (reader/reader-template.html: <div id="sutta" class="sutta">), от него
   зависят реальные стили (reader/css/rus-multi.css #sutta{max-width,line-height} и все
   hide-pali/hide-english/column-view правила) — без него текст был лишь ПОХОЖ на прод, но не
   пользовался теми же CSS-правилами (это и была причина жалобы "не использует стили ридера"). */
.demo-seg { margin-bottom: 14px; }
.demo-seg:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<a class="toggle-dict-btn dict-shim" aria-hidden="true" tabindex="-1"><img src="/assets/svg/comment.svg" alt=""></a>
<a id="toggle-multiselect" class="dict-shim" aria-hidden="true" tabindex="-1"><img src="/assets/svg/select-slash.svg" alt=""></a>
<div id="sutta" class="sutta"></div>
<script>
// Та же самая замена, что reader/megareader.js's window.applyRemovePunct делает на проде —
// скопировано буквально, символ в символ (запятая там БЫЛА в реальном regex, а в этом файле её
// раньше забыли — "убрать пунктуацию" визуально не убирало запятые, хотя в самом ридере всё
// это время работало правильно).
function stripPunct(t) {
  return localStorage.getItem('removePunct') === 'true'
    ? t.replace(/[-—–]/g, ' ').replace(/[:;“”‘’,"']/g, '').replace(/[.?!]/g, ' | ')
    : t;
}
function pickReaderLangs() {
  // Дефолт, когда языки ещё не настраивали, — РОВНО тот же, что показывает сама страница настроек
  // (settings/index.html: DEFAULT_LANGS = isRu ? ['ru','en'] : ['en']). Здесь было захардкожено
  // 'ru,en' всегда: при английском интерфейсе в чипах стоял один English, а образец всё равно
  // показывал русский перевод — то есть демо противоречило настройке прямо над ним.
  const raw = localStorage.getItem('dhammaReaderLangs') || localStorage.getItem('dhammaSearchLangs');
  if (raw) return raw.split(',').map(s => s.trim()).filter(Boolean);
  const isRu = (localStorage.getItem('dhammaLanguage') || localStorage.getItem('siteLanguage') || 'en') === 'ru';
  return isRu ? ['ru', 'en'] : ['en'];
}
// Акшарамукха живёт только в Node (не в браузере посетителя) — образец берёт уже готовый,
// заранее сконвертированный набор из settings/demo-data.json (dg-light.js, buildSettingsDemoCache
// считает ISOPali + все SCRIPT_MAP-варианты при старте сервера), не конвертирует сам.
function pickScript() {
  return localStorage.getItem('selectedScript') || 'ISOPali';
}
function currentGroups() {
  const byScript = window.__demoByScript || {};
  return byScript[pickScript()] || byScript.ISOPali || [];
}
// Та же разметка, что генерирует reader/megareader.js в реальном ридере (id сегмента,
// .pli-lang.quote, .right-column с {lang}-lang.quote и .lang-2nd на втором переводчике) —
// только без всей логики путей/режимов/навигации, которая тут не нужна.
function renderSegment(seg, wantedLangs) {
  const anchor = seg.segment.includes(':') ? seg.segment.split(':').slice(1).join(':') : seg.segment;
  let inner = `<span class="pli-lang inputscript-ISOPali quote" lang="pi">${stripPunct(seg.root_text || seg.variant || '')}</span>`;
  const keys = Object.keys(seg.translations);
  const byLang = {};
  keys.forEach(k => {
    const lang = k.split('_')[0];
    (byLang[lang] = byLang[lang] || []).push(k);
  });
  // Раньше здесь было wantedLangs.concat(keys.map(...)) — показывало выбранные языки, а ЗАТЕМ
  // ещё и ЛЮБЫЕ другие языки, какие нашлись в закэшированном демо-сегменте (жалоба "демо
  // показывает en/ru/de, хотя выбрано только ru/en"). Строго только wantedLangs; на другие
  // языки падаем ТОЛЬКО если среди выбранных вообще ничего не нашлось (иначе образец мог бы
  // остаться пустым для языка, которого именно у этого сегмента нет).
  let right = '';
  const langsToRender = wantedLangs.some(l => byLang[l] && byLang[l].length)
    ? wantedLangs
    : wantedLangs.concat(keys.map(k => k.split('_')[0]));
  langsToRender.forEach((lang) => {
    if (!byLang[lang] || !byLang[lang].length) return;
    byLang[lang].forEach((key, idx) => {
      const translatorId = key.split('_').slice(1).join('_');
      const posClass = idx === 0 ? '' : ' lang-2nd';
      right += `<span class="${lang}-lang${posClass} quote" lang="${lang}" data-translator="${translatorId}">${stripPunct(seg.translations[key])}</span>`;
    });
    delete byLang[lang];
  });
  if (right) inner += `<span class="right-column">${right}</span>`;
  // <p>, не <div> — реальный корень бага "чёрное на чёрном" + "не те стили/шрифты": ВСЕ базовые
  // правила цвета и шрифта в rus-multi.css (включая .dark-варианты) заданы через
  // "p .pli-lang"/"p .lang-2nd"/"p,li,h1-h5{color,font-family}" — то есть требуют родителя
  // p/li/dt/dd/h1-h5. Внутри <div><span> эти правила просто никогда не срабатывали: текст
  // наследовал дефолтный цвет/шрифт браузера (тёмный) вместо реального светлого текста для
  // тёмной темы — совпадение с фоном и "не тот шрифт" были СЛЕДСТВИЕМ этого, не отдельными
  // багами.
  return `<p class="demo-seg" id="${anchor}">${inner}</p>`;
}
// Фрагмент выбирается СЛУЧАЙНО РОВНО ОДИН РАЗ — при первой загрузке кадра — и дальше не меняется
// до конца сессии настроек. Любой render() (смена пунктуации, языка, темы, шрифта, письменности,
// кнопка "обновить") перерисовывает ТОТ ЖЕ САМЫЙ фрагмент с новыми стилями. Запоминается sutta_id,
// а не индекс: наборы groups у разных письменностей — разные массивы, и индекс мог указать на
// другую сутту при переключении скрипта.
let currentSuttaId = null;
function render() {
  const groups = currentGroups();
  if (!groups.length) return;
  let group = currentSuttaId ? groups.find(g => g.sutta_id === currentSuttaId) : null;
  if (!group) {
    group = groups[Math.floor(Math.random() * groups.length)];
    currentSuttaId = group.sutta_id;
  }
  const wantedLangs = pickReaderLangs();
  document.getElementById('sutta').innerHTML = group.segments.map(s => renderSegment(s, wantedLangs)).join('');
  // Родительская страница не знает, какой фрагмент сейчас показан (случайный выбор — здесь) —
  // сообщаем sutta_id И id первого сегмента, чтобы "Читать" открывала ридер РОВНО на этом месте,
  // а не в начале сутты (ридер понимает якорь: megareader.js читает location.hash и скроллит к
  // элементу с таким id).
  const firstSeg = group.segments[0] && group.segments[0].segment;
  const anchorId = firstSeg ? (firstSeg.includes(':') ? firstSeg.split(':').slice(1).join(':') : firstSeg) : null;
  window.parent.postMessage({ type: 'dg-preview-current', suttaId: group.sutta_id, segmentId: anchorId }, location.origin);
  reportHeight();
}
/* Высота кадра равна высоте текста. Родитель не может померить её сам (кросс-документ), поэтому
   меряем здесь и сообщаем наверх. Нужно и после render(), и после того как догрузятся шрифты и
   пересчитается перенос строк — иначе первое измерение уходит по системному serif и оказывается
   заниженным. ResizeObserver ловит всё остальное: смену размера текста, письменности, языков. */
function reportHeight() {
  // Меряем ТЕЛО, а не documentElement.scrollHeight. Разница принципиальная: paliLookup.js
  // вставляет в кадр служебные элементы с position:fixed (плашка #bubbleNotification и т.п.),
  // и хотя они не занимают места в потоке, в область прокрутки ДОКУМЕНТА они входят — после
  // первого же обращения к словарю scrollHeight подскакивал (замерено: 210 -> 250) и под
  // текстом снова появлялась пустая полоса, ровно та, ради которой всё это и делалось.
  // body.scrollHeight считает только содержимое тела, fixed-элементы в него не попадают.
  const h = Math.ceil(document.body.scrollHeight);
  window.parent.postMessage({ type: 'dg-preview-height', height: h }, location.origin);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reportHeight);
if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.documentElement);
window.addEventListener('resize', reportHeight);

// Тема — то же самое, что реально пишет /assets/js/themeswitch.js на проде: body.classList
// 'dark' + <html data-bs-theme="..">, а не просто наш собственный body.dark (от этого зависят
// Bootstrap-переменные --bs-body-bg/--bs-body-color в styles.css) — без этого образец всегда
// выглядел светлым, даже когда сам сайт был в тёмной теме.
function applyTheme() {
  const t = localStorage.getItem('theme') || 'auto';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark', dark);
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
}
applyTheme();
const scale = parseInt(localStorage.getItem('uiScale')) || 100;
document.documentElement.style.fontSize = scale + '%';
fetch('/settings/demo-data.json').then(r => r.ok ? r.json() : {}).then(byScript => {
  window.__demoByScript = byScript || {};
  render();
});
window.addEventListener('storage', e => {
  if (['removePunct', 'dhammaReaderLangs', 'dhammaSearchLangs', 'uiScale', 'selectedScript'].includes(e.key)) {
    if (e.key === 'uiScale') document.documentElement.style.fontSize = (parseInt(localStorage.getItem('uiScale')) || 100) + '%';
    render();
  }
  if (e.key === 'theme') applyTheme();
  if (e.key === 'dictionaryVisible') syncDict();
  // Смена режима словаря должна применяться СРАЗУ, без перезагрузки страницы настроек.
  // paliLookup.js читает selectedDict в свою переменную savedDict ОДИН РАЗ, при загрузке
  // скрипта, и дальше на localStorage не смотрит — поэтому в образце всегда открывался тот
  // режим, который был активен в момент первого клика по слову (обычно дефолтный встроенный
  // английский DPD), сколько бы раз режим ни меняли. У самого paliLookup для этого есть
  // applyDictConfig() — он и переставляет savedDict, и пересобирает URL, и сбрасывает кэш
  // загруженной базы; зовём именно его, а не переизобретаем.
  if (e.key === 'selectedDict') {
    syncDictLang();
    if (typeof window.applyDictConfig === 'function') {
      window.applyDictConfig(localStorage.getItem('selectedDict') || 'standalone');
    }
  }
});
/* Словарь работает прямо в образце — тем же самым скриптом, что и в ридере (paliLookup.js),
   а не имитацией: он сам вешает свои обработчики на клик и на выделение внутри .pli-lang/[lang=pi],
   сам читает выбранный режим (selectedDict), автопоиск выделения (multiSelectMode) и задержку
   (dictAutoLookupDelay). На проде его лениво подгружает /assets/js/settings.js при первом клике по
   пали — здесь ту же ленивую загрузку делаем сами, чтобы не тащить в образец весь общесайтовый
   settings.js с его тулбаром, горячими клавишами и модалками. */
let dictLoading = null;
function loadDict() {
  if (dictLoading) return dictLoading;
  dictLoading = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = '/assets/js/paliLookup.js';
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  return dictLoading;
}
function dictEnabled() { return localStorage.getItem('dictionaryVisible') !== 'false'; }
// Для режимов "dpdfull..." и "newwindow..." paliLookup.js собирает адрес словаря не по самому
// режиму, а по глобалу window.isRu (его выставляют страницы ридера и поиска). В нашем кадре
// этого глобала нет, поэтому "Попап Dict.DG (ru)" и "(en)" давали ОДИН И ТОТ ЖЕ английский
// адрес — со стороны это и выглядело как "режимы не переключаются, всегда встроенный
// английский". Берём язык из самого выбранного режима: суффикс "ru" в его коде и означает
// русскую сторону словаря.
function syncDictLang() {
  const mode = localStorage.getItem('selectedDict') || 'standalone';
  window.isRu = /ru$/.test(mode);
}
syncDictLang();
function syncDict() { if (dictEnabled()) loadDict(); }
// Клик по пали грузит словарь и повторяет клик уже с загруженным скриптом — ровно тот же приём,
// что и в общесайтовом settings.js (иначе первый клик пропадал бы впустую).
document.addEventListener('click', e => {
  if (!dictEnabled() || window.__dictReady) return;
  if (!e.target.closest('.pli-lang, [lang="pi"]')) return;
  e.preventDefault(); e.stopPropagation();
  const t = e.target, x = e.clientX, y = e.clientY;
  loadDict().then(ok => {
    if (!ok) return;
    window.__dictReady = true;
    t.dispatchEvent(new MouseEvent('click', { view: window, bubbles: true, cancelable: true, clientX: x, clientY: y }));
  });
}, true);
// Автопоиск по выделению (multiSelectMode) вешается внутри paliLookup.js на selectionchange —
// значит скрипт должен быть уже загружен к моменту выделения, клика может и не быть.
document.addEventListener('selectionchange', () => {
  if (!dictEnabled() || localStorage.getItem('multiSelectMode') !== 'true') return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim()) loadDict().then(ok => { if (ok) window.__dictReady = true; });
});
if (dictEnabled() && localStorage.getItem('multiSelectMode') === 'true') loadDict();
window.addEventListener('message', e => {
  // Только refresh: перерисовать текущий фрагмент с актуальными настройками. Пути, меняющего
  // фрагмент, больше нет — он один на всю сессию настроек.
  if (e.data === 'dg-preview-refresh') render();
});
</script>
</body>
</html>
