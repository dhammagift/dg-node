<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 — Dhamma.gift</title>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1e3a4c"/><text x="50" y="60" text-anchor="middle" font-family="Helvetica" font-size="26" fill="#7fd4bd">404</text></svg></template>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
*{box-sizing:border-box}
html{width:100%}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
.gi{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;vertical-align:-.12em;flex:none}
.shell{display:flex;align-items:center;gap:8px;width:100%;max-width:620px;background:var(--dg-surface-hover);border:1px solid var(--dg-border);border-radius:999px;padding:7px 8px 7px 16px;transition:border-color .15s var(--dg-ease),box-shadow .15s var(--dg-ease)}
.shell:focus-within{border-color:var(--dg-accent);box-shadow:0 0 0 3px var(--dg-accent-bg)}
.shell .conch{width:20px;height:20px;flex:none;opacity:.85;display:grid;place-items:center;border-radius:5px;transition:opacity .15s var(--dg-ease)}
.shell a.conch:hover{opacity:1}
.shell .conch img{width:20px;height:20px;display:block}
.shell input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--dg-text);min-width:0}
.shell input::placeholder{color:var(--dg-text-muted);opacity:.75}
.shell .clr{width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--dg-text-muted);cursor:pointer;font-size:13px;flex:none;display:grid;place-items:center}
.shell .clr:hover{background:var(--dg-border);color:var(--dg-text)}
.shell .rnd{width:34px;height:34px;border:1px solid var(--dg-border-strong);border-radius:50%;background:var(--dg-surface);color:var(--dg-text-2);cursor:pointer;font-size:13.5px;flex:none;display:grid;place-items:center;transition:all .15s var(--dg-ease)}
.shell .rnd:hover{border-color:var(--dg-accent);color:var(--dg-accent-ink)}
.rb{width:38px;height:38px;border:1.5px solid var(--dg-border-strong);border-radius:50%;background:var(--dg-surface);color:var(--dg-text-2);cursor:pointer;font-size:14px;flex:none;display:grid;place-items:center;transition:all .15s var(--dg-ease)}
.rb:hover{border-color:var(--dg-accent);color:var(--dg-accent-ink)}
.rb:active{transform:translateY(1px)}
.rb.plain{border:0;background:none;color:var(--dg-text-2);font-size:17px}
.rb.plain:hover{background:var(--dg-surface-hover);color:var(--dg-text)}
.tbar{background:var(--dg-page);border-bottom:1px solid transparent;padding:12px 20px 8px;display:flex;align-items:center;justify-content:center;gap:9px}
body{display:block!important;width:100%;min-width:0;margin:0;background:var(--dg-page);color:var(--dg-text);font-family:var(--dg-font);-webkit-font-smoothing:antialiased;font-size:15px}
a{color:var(--dg-accent-ink);text-decoration:none}a:hover{color:var(--dg-accent-ink)}
h1{font-family:var(--dg-font);letter-spacing:-.01em}
.tbar .shell{max-width:560px}
.tbar .shell .rnd .fa-sliders{transform:rotate(90deg)}
.nf{max-width:600px;margin:0 auto;padding:44px 0 64px;text-align:center}
/* Цифра набрана тонким начертанием с широким трекингом: тот же жест, что в проде,
   но без «блокбастерной» жирности — и средний нуль приглушён до акцентного тона. */
.nf .code{font-size:104px;line-height:.92;font-weight:200;letter-spacing:.06em;color:var(--dg-text);margin:0;font-feature-settings:"tnum"}
.nf .code em{font-style:normal;color:var(--dg-accent)}
.nf h1{font-size:25px;font-weight:500;line-height:1.3;margin:18px 0 0;text-wrap:balance}
.nf h1 span{color:var(--dg-accent-ink);font-style:italic}
.nf .verse{margin:22px auto 0;max-width:46ch}
.nf .verse .pali{margin:0;font-size:16px;line-height:1.65;font-style:italic;color:var(--dg-text-2);text-wrap:pretty}
.nf .verse .pali a{color:var(--dg-accent-ink);font-style:normal;font-size:14px;white-space:nowrap}
.nf .verse .pali a:hover{text-decoration:underline;text-underline-offset:3px}
.nf .verse .tr{margin:9px 0 0;font-size:13px;line-height:1.6;color:var(--dg-text-muted);text-wrap:pretty}
.nf .acts{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding:26px 0 0}
.nf .acts .primary{border:0;border-radius:999px;background:var(--dg-accent-dark);color:#fff;font:inherit;font-size:14px;font-weight:500;padding:10px 26px;cursor:pointer;box-shadow:0 2px 12px rgba(15,124,99,.22);transition:background .15s var(--dg-ease),box-shadow .15s var(--dg-ease)}
.nf .acts .primary:hover{background:var(--dg-accent);box-shadow:0 4px 18px rgba(15,124,99,.28)}
.nf .acts .primary:active{transform:translateY(1px)}
.nf .acts .ghost{border:0;background:none;font:inherit;font-size:13.5px;color:var(--dg-text-2);padding:10px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .15s var(--dg-ease)}
.nf .acts .ghost:hover{color:var(--dg-accent-ink)}
/* Сетка разделов — как в проде: глиф сверху, подпись снизу, без карточек.
   Стиля добавляет мягкий кружок, темнеющий под курсором. */
.nfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 6px;margin:36px auto 0;padding:26px 0 0;border-top:1px solid var(--dg-border)}
.nfgrid a{display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 6px 14px;border-radius:12px;color:var(--dg-text-2);font-size:12.5px;line-height:1.3;text-align:center;transition:color .15s var(--dg-ease),background .15s var(--dg-ease)}
.nfgrid a:hover{background:var(--dg-surface-hover);color:var(--dg-text)}
.nfgrid a .disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--dg-accent-bg);color:var(--dg-on-accent-bg);font-size:18px;transition:background .15s var(--dg-ease),color .15s var(--dg-ease)}
.nfgrid a:hover .disc{background:var(--dg-accent-dark);color:#fff}
@media(max-width:760px){.nf .code{font-size:76px}.nf h1{font-size:21px}.nfgrid a{font-size:11.5px}}
</style></head>
<body>

    <button class="rnd" type="button" title="Быстрые настройки" onclick="open_('qsp')"><i class="fa-solid fa-sliders"></i></button>
    <button class="rnd" type="submit" title="Искать"><i class="fa-solid fa-magnifying-glass"></i></button>

  <button class="rb plain" type="button" title="Меню" onclick="open_('drawer')"><i class="fa-solid fa-bars"></i></button>
</div>
<main class="wrap">

      <div class="verse">
        <p class="pali">“Atthi kho, āvuso, maggo atthi paṭipadā, etassa dukkhassa pariññāyā”ti. <a href="#" onclick="go('reader');return false">sn38.4</a></p>
        <p class="tr">«Есть, друг, путь, есть практика — для полного понимания этой дуккхи».</p>
      </div>
      <div class="acts">
        <button class="primary" type="button" onclick="go('home')">На главную</button>
      </div>
      <nav class="nfgrid">
        <a href="#" onclick="go('toc');return false"><span class="disc"><i class="gi" style="--u:url(../../assets/svg/book.svg)"></i></span>Читать Pāḷi</a>
        <a href="#" onclick="return false"><span class="disc"><i class="gi" style="--u:url(../../assets/svg/book.svg)"></i></span>Иностранные</a>
        <a href="#" onclick="return false"><span class="disc"><i class="gi" style="--u:url(../../assets/svg/book.svg)"></i></span>Русские</a>
        <a href="#" onclick="return false"><span class="disc"><i class="fa-solid fa-book-atlas"></i></span>ИИ, Словари</a>
        <a href="#" onclick="return false"><span class="disc"><i class="fa-solid fa-graduation-cap"></i></span>Обучение</a>
        <a href="#" onclick="return false"><span class="disc"><i class="fa-solid fa-screwdriver-wrench"></i></span>Инструменты</a>
        <a href="#" onclick="open_('multi');return false"><span class="disc"><i class="gi" style="--u:url(../../assets/svg/clock-rotate-left.svg)"></i></span>История</a>
        <a href="#" onclick="return false"><span class="disc"><i class="gi" style="--u:url(../../assets/svg/question.svg)"></i></span>Помощь</a>
      </nav>
    </div>
</main>

</body></html>
