              - generic [ref=e519]:
                - generic [ref=e520]:
                  - generic [ref=e521] [cursor=pointer]: ✦
                  - text: "И сев, Благостный обратился к монахам: “Ради какой беседы вы сейчас уселись здесь, монахи, и на чем же прервалась беседа между вами?”"
                  - generic [ref=e522] [cursor=pointer]: ✦
