            - generic [ref=e2569]:
              - generic [ref=e2570]:
                - generic [ref=e2571] [cursor=pointer]: ✦
                - text: "Idha, bhikkhave, ekacco samaṇo vā brāhmaṇo vā takkī hoti vīmaṁsī, so takkapariyāhataṁ vīmaṁsānucaritaṁ sayaṁ paṭibhānaṁ evamāha:"
