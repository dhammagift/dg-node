              - generic [ref=e4199]:
                - generic [ref=e4200]:
                  - generic [ref=e4201] [cursor=pointer]: ✦
                  - text: И вот, если бы, не понимая, что это в согласии с истиной хорошо, не понимая, что это в согласии с истиной нехорошо, я стал бы разъяснять, что это хорошо, стал бы разъяснять, что это нехорошо, то меня охватило бы стремление, или страсть, или ненависть, или отвращение. Если меня охватило бы стремление, или страсть, или ненависть, или отвращение, то я был бы неправ.
