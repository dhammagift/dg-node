              - generic [ref=e2689]:
                - generic [ref=e2690]:
                  - generic [ref=e2691] [cursor=pointer]: ✦
                  - text: Таковы, монахи, эти предметы — глубокие, трудные для рассмотрения, трудные для постижения, несущие покой, возвышенные, недоступные рассудку, тонкие, ведомые лишь мудрецам, — которые возглашает сам Татхагата, познав их и увидев собственными глазами, и, поистине, ради которых следует произносить надлежащую хвалу Татхагате”.
