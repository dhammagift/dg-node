                - generic [ref=e3086] [cursor=pointer]: ✦
              - generic [ref=e3087]:
                - generic [ref=e3088]:
                  - generic [ref=e3089] [cursor=pointer]: ✦
                  - text: „Ведь тот досточтимый Брахма, великий Брахма, победоносный, непобедимый, всевидящий, всесильный, владыка, творец, созидатель, наилучший устроитель, повелитель, отец бывшего и будущего досточтимый Брахма, которым мы сотворены, надежен, стоек, вечен, не подвержен изменению и вечно пребывает таким.
                  - generic [ref=e3090] [cursor=pointer]: ✦
                - generic [ref=e3091]:
                  - generic [ref=e3092] [cursor=pointer]: ✦
