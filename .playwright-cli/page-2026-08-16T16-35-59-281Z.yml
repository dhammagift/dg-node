                - text: Ahañce kho pana “idaṁ kusalan”ti yathābhūtaṁ appajānanto, “idaṁ akusalan”ti yathābhūtaṁ appajānanto, “idaṁ kusalan”ti vā byākareyyaṁ, “idaṁ akusalan”ti vā byākareyyaṁ, taṁ mamassa musā.
