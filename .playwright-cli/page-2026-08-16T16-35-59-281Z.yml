                  - text: And whatever contemplatives & brahmans who are adherents of a neither percipient nor non-percipient after-death, who proclaim a neither percipient nor non-percipient self after death, they all do so on one or another of these eight grounds. There is nothing outside of this. “With regard to this, the Tathāgata discerns that ‘These standpoints, thus seized, thus grasped at, lead to such & such a destination, to such & such a state in the world beyond.’ That the Tathāgata discerns. And he discerns what is higher than that. And yet, discerning that, he does not grasp at it. And as he is not grasping at it, unbinding [nibbuti] is experienced right within. Knowing, as they have come to be, the origination, ending, allure, & drawbacks of feelings, along with the escape from feelings, the Tathāgata, monks—through lack of clinging/sustenance—is released. “These, monks, are the dhammas—deep, hard to see, hard to realize, tranquil, refined, beyond the scope of conjecture, subtle, to-be-experienced by the wise—that the Tathāgata proclaims, having directly known & realized them for himself,
