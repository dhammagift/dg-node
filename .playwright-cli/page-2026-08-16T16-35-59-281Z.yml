            - generic [ref=e2848]:
              - generic [ref=e2849]:
                - generic [ref=e2850] [cursor=pointer]: ✦
                - text: Atha aññepi sattā āyukkhayā vā puññakkhayā vā ābhassarakāyā cavitvā brahmavimānaṁ upapajjanti tassa sattassa sahabyataṁ.
                - generic [ref=e2851] [cursor=pointer]: ✦
              - generic [ref=e2852]:
                - generic [ref=e2853]:
                  - generic [ref=e2854] [cursor=pointer]: ✦
                  - text: Тогда другие существа, оттого ли, что окончился срок или окончилось [действие] заслуг, оставляют существование в сонме сияния и вновь рождаются во дворце Брахмы спутниками того существа.
                  - generic [ref=e2855] [cursor=pointer]: ✦
                - generic [ref=e2856]:
                  - generic [ref=e2857] [cursor=pointer]: ✦
                  - text: “Then other beings, through the ending of their life span or the ending of their merit, fall from the company of the Radiant and reappear in the Brahmā palace, in the company of that being.
                  - generic [ref=e2858] [cursor=pointer]: ✦
            - generic [ref=e2859]:
              - generic [ref=e2860]:
                - generic [ref=e2861] [cursor=pointer]: ✦
                - text: Tepi tattha honti manomayā pītibhakkhā sayaṁpabhā antalikkhacarā subhaṭṭhāyino, ciraṁ dīghamaddhānaṁ tiṭṭhanti.
                - generic [ref=e2862] [cursor=pointer]: ✦
              - generic [ref=e2863]:
                - generic [ref=e2864]:
                  - generic [ref=e2865] [cursor=pointer]: ✦
                  - text: Там они находятся долгое, длительное время, состоя из разума, питаясь радостью, излучая собой сияние, двигаясь в пространстве, пребывая в славе.
                  - generic [ref=e2866] [cursor=pointer]: ✦
                - generic [ref=e2867]:
                  - generic [ref=e2868] [cursor=pointer]: ✦
                  - text: And there they still stay mind-made, feeding on rapture, self-luminous, coursing through the air, established in beauty for a long stretch of time.
                  - generic [ref=e2869] [cursor=pointer]: ✦
          - paragraph [ref=e2870]:
            - generic [ref=e2871]:
              - generic [ref=e2872]:
                - generic [ref=e2873] [cursor=pointer]: ✦
                - text: "Tatra, bhikkhave, yo so satto paṭhamaṁ upapanno tassa evaṁ hoti:"
                - generic [ref=e2874] [cursor=pointer]: ✦
              - generic [ref=e2875]:
                - generic [ref=e2876]:
                  - generic [ref=e2877] [cursor=pointer]: ✦
                  - text: "Тогда, монахи, то существо, которое первым родилось вновь, говорит себе так:"
                  - generic [ref=e2878] [cursor=pointer]: ✦
                - generic [ref=e2879]:
                  - generic [ref=e2880] [cursor=pointer]: ✦
