              - generic [ref=e620]:
                - generic [ref=e621]:
                  - generic [ref=e622] [cursor=pointer]: ✦
                  - text: Если вы, монахи, будете сердиться или горевать, когда другие порицают меня, или порицают дхамму, или порицают сангху, то вам же будет от этого ущерб.
