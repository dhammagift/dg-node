                  - generic [ref=e2832] [cursor=pointer]: ✦
                  - text: "У него там, пребывающего долгое время в одиночестве, возникает тревога, неудовлетворенность, беспокойство:"
                  - generic [ref=e2833] [cursor=pointer]: ✦
                - generic [ref=e2834]:
                  - generic [ref=e2835] [cursor=pointer]: ✦
                  - text: "“After dwelling there alone for a long time, he experiences displeasure & agitation:"
