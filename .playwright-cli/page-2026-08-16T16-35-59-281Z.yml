                  - generic [ref=e6449] [cursor=pointer]: ✦
                  - text: Ибо, монахи, все те отшельники или брахманы, которые проповедуют разрушение и учат о разрушении, гибели, уничтожении живого существа, [делают так] на семи этих основаниях или на каком-нибудь одном из них — нет, кроме этого, других [оснований] …
