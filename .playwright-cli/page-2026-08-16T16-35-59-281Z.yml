                - generic [ref=e6595]:
                  - generic [ref=e6596] [cursor=pointer]: ✦
                  - text: Ведь желания, досточтимый, ненадежны, болезненны, изменчивы по природе, с их изменчивостью и превратностью возникают горе, плач, боль, неудовлетворенность, беспокойство.
