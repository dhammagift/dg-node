              - generic [ref=e2677]:
                - generic [ref=e2678]:
                  - generic [ref=e2679] [cursor=pointer]: ✦
                  - text: Постигнув в согласии с истиной и возникновение, и исчезновение, и сладость, и горечь, и преодоление ощущений, Татхагата, монахи, освободился, лишившись всякой зависимости.
