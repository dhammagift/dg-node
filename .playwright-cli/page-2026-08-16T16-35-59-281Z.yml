              - generic [ref=e542]:
                - generic [ref=e543]:
                  - generic [ref=e544] [cursor=pointer]: ✦
                  - text: "“Почтенный! После ночи, поднявшись на заре, собравшись и усевшись в беседке, мы повели здесь разговор такого рода:"
                  - generic [ref=e545] [cursor=pointer]: ✦
                - generic [ref=e546]:
                  - generic [ref=e547] [cursor=pointer]: ✦
                  - text: "“Just now, lord, among us—as we had arisen in the last watch of the night and were sitting gathered together in (this) pavilion—this discussion arose:"
                  - generic [ref=e548] [cursor=pointer]: ✦
            - generic [ref=e549]:
              - generic [ref=e550]:
                - generic [ref=e551] [cursor=pointer]: ✦
                - text: ‘acchariyaṁ, āvuso, abbhutaṁ, āvuso, yāvañcidaṁ tena bhagavatā jānatā passatā arahatā sammāsambuddhena sattānaṁ nānādhimuttikatā suppaṭividitā.
                - generic [ref=e552] [cursor=pointer]: ✦
              - generic [ref=e553]:
                - generic [ref=e554]:
                  - generic [ref=e555] [cursor=pointer]: ✦
                  - text: „Как чудесно, братья, как необычно, братья, что Благостный — [все]знающий, [все]видящий, архат, в совершенстве пробужденный, — столь хорошо постиг различные склонности существ!
                  - generic [ref=e556] [cursor=pointer]: ✦
                - generic [ref=e557]:
                  - generic [ref=e558] [cursor=pointer]: ✦
                  - text: ‘Isn’t it amazing! Isn’t it astounding!—how the Blessed One, the one who knows, the one who sees, worthy & rightly self-awakened, has truly experienced the differing convictions of beings.
