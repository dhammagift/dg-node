                  - text: те отшельники и брахманы, которые заняты будущими временами; те отшельники и брахманы, которые заняты прежними временами, и заняты будущими временами, и занятые прежними и будущими временами, рассуждают о прежних и будущих временах и на шестидесяти двух основаниях выдвигают различные суждения о прежних и будущих временах, — все они постигают, последовательно обретая шесть оснований чувственного восприятия. Их ощущения — причина жажды, жажда — причина стремления, стремление — причина становления, становление — причина рождения, рождение — причина старости, смерти; [от него] происходят горе, плач, боль, неудовлетворенность, беспокойство.
