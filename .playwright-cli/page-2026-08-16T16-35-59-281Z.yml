                  - text: "Вот, монахи, какой-нибудь отшельник или брахман предается рассуждению и исследованию. И убежденный рассуждением, побуждаемый исследованием, он произносит такое собственное заключение:"
                  - generic [ref=e2576] [cursor=pointer]: ✦
