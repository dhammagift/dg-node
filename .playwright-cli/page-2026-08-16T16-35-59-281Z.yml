          - paragraph [ref=e3014]:
            - generic [ref=e3015]:
              - generic [ref=e3016]:
                - generic [ref=e3017] [cursor=pointer]: ✦
                - text: Tatra, bhikkhave, yo so satto paṭhamaṁ upapanno, so dīghāyukataro ca hoti vaṇṇavantataro ca mahesakkhataro ca.
                - generic [ref=e3018] [cursor=pointer]: ✦
              - generic [ref=e3019]:
                - generic [ref=e3020]:
                  - generic [ref=e3021] [cursor=pointer]: ✦
                  - text: И вот, монахи, то существо, которое первым родилось вновь, становится более долгоживущим, красивым и могущественным.
                  - generic [ref=e3022] [cursor=pointer]: ✦
                - generic [ref=e3023]:
                  - generic [ref=e3024] [cursor=pointer]: ✦
                  - text: The being who reappeared first is of longer life span, more beautiful, & more influential,
                  - generic [ref=e3025] [cursor=pointer]: ✦
            - generic [ref=e3026]:
              - generic [ref=e3027]:
                - generic [ref=e3028] [cursor=pointer]: ✦
                - text: Ye pana te sattā pacchā upapannā, te appāyukatarā ca honti dubbaṇṇatarā ca appesakkhatarā ca.
                - generic [ref=e3029] [cursor=pointer]: ✦
              - generic [ref=e3030]:
                - generic [ref=e3031]:
                  - generic [ref=e3032] [cursor=pointer]: ✦
                  - text: Те же существа, которые позже родились вновь, становятся менее долгоживущими, менее привлекательными и менее могущественными.
                  - generic [ref=e3033] [cursor=pointer]: ✦
                - generic [ref=e3034]:
                  - generic [ref=e3035] [cursor=pointer]: ✦
                  - text: while the beings who reappeared later are of shorter life span, less beautiful, & less influential.
                  - generic [ref=e3036] [cursor=pointer]: ✦
          - paragraph [ref=e3037]:
            - generic [ref=e3038]:
              - generic [ref=e3039]:
                - generic [ref=e3040] [cursor=pointer]: ✦
                - text: Ṭhānaṁ kho panetaṁ, bhikkhave, vijjati, yaṁ aññataro satto tamhā kāyā cavitvā itthattaṁ āgacchati.
                - generic [ref=e3041] [cursor=pointer]: ✦
              - generic [ref=e3042]:
                - generic [ref=e3043]:
                  - generic [ref=e3044] [cursor=pointer]: ✦
                  - text: И может случиться, монахи, что какое-либо существо, покинув свое предыдущее тело, достигает земного состояния.
                  - generic [ref=e3045] [cursor=pointer]: ✦
                - generic [ref=e3046]:
                  - generic [ref=e3047] [cursor=pointer]: ✦
                  - text: “Now, there is the possibility, monks, that a certain being, having fallen from that company, comes to this world.
