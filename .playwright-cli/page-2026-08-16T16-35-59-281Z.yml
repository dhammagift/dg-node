              - generic [ref=e7706]:
                - generic [ref=e7707]:
                  - generic [ref=e7708] [cursor=pointer]: ✦
                  - text: И когда, монахи, монах постигает в согласии с истиной и возникновение, и исчезновение, и сладость, и горечь, и преодоление шести органов чувственного восприятия, то он постигает и выходящее за пределы их всех.
                  - generic [ref=e7709] [cursor=pointer]: ✦
                - generic [ref=e7710]:
                  - generic [ref=e7711] [cursor=pointer]: ✦
                  - text: “But when a monk discerns the origination, ending, allure, drawbacks of, & escape from the six sense media, he discerns what is higher than all of this.
