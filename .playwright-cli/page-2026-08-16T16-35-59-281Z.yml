                  - generic [ref=e7687] [cursor=pointer]: ✦
                  - text: "where any of those contemplatives & brahmans who are theorists about the past, theorists about the future, & theorists about the past & the future, who hold views about the past & the future, who approve of various beliefs with reference to the past & the future on 62 grounds: “They all experience that through repeated contact at the six sense media. For them, from feeling as a requisite condition comes craving. From craving as a requisite condition comes clinging/sustenance. From clinging/sustenance as a requisite condition comes becoming. From becoming as a requisite condition comes birth. From birth as a requisite condition, then aging-&-death, sorrow, lamentation, pain, distress, & despair come into play. Such is the origination of this entire mass of stress & suffering."
