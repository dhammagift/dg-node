                  - text: Таково, монахи, четвертое основание, исходя из которого и о котором [говорят] некоторые отшельники и брахманы, уклончивые, словно скользкая рыба, ведущие уклончивую речь, когда им задают тот или иной вопрос, — уклончивую, словно скользкая рыба.
