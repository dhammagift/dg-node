            - generic [ref=e2625]:
              - generic [ref=e2626]:
                - generic [ref=e2627] [cursor=pointer]: ✦
                - text: Ye hi keci, bhikkhave, samaṇā vā brāhmaṇā vā sassatavādā sassataṁ attānañca lokañca paññapenti, sabbe te imeheva catūhi vatthūhi, etesaṁ vā aññatarena; natthi ito bahiddhā.
                - generic [ref=e2628] [cursor=pointer]: ✦
              - generic [ref=e2629]:
                - generic [ref=e2630]:
                  - generic [ref=e2631] [cursor=pointer]: ✦
                  - text: Ибо, монахи, все те отшельники или брахманы, которые проповедуют вечность и учат, что и свое „я“ и мир вечны, [делают так] на четырех этих основаниях или на каком-нибудь одном из них — нет, кроме этого, [других оснований].
                  - generic [ref=e2632] [cursor=pointer]: ✦
                - generic [ref=e2633]:
                  - generic [ref=e2634] [cursor=pointer]: ✦
                  - text: And whatever contemplatives & brahmans who are adherents of eternalism, who proclaim an eternal self & cosmos, they all do so on one or another of these four grounds. There is nothing outside of this.
                  - generic [ref=e2635] [cursor=pointer]: ✦
          - paragraph [ref=e2636]:
            - generic [ref=e2637]:
              - generic [ref=e2638]:
                - generic [ref=e2639] [cursor=pointer]: ✦
