            - generic [ref=e3049]:
              - generic [ref=e3050]:
                - generic [ref=e3051] [cursor=pointer]: ✦
                - text: Itthattaṁ āgato samāno agārasmā anagāriyaṁ pabbajati.
                - generic [ref=e3052] [cursor=pointer]: ✦
              - generic [ref=e3053]:
                - generic [ref=e3054]:
                  - generic [ref=e3055] [cursor=pointer]: ✦
                  - text: Достигнув земного состояния, оно покидает дом и принимается за жизнь бездомного.
                  - generic [ref=e3056] [cursor=pointer]: ✦
                - generic [ref=e3057]:
                  - generic [ref=e3058] [cursor=pointer]: ✦
                  - text: Having come to this world, he goes forth from the home life into homelessness.
                  - generic [ref=e3059] [cursor=pointer]: ✦
            - generic [ref=e3060]:
              - generic [ref=e3061]:
                - generic [ref=e3062] [cursor=pointer]: ✦
                - text: Agārasmā anagāriyaṁ pabbajito samāno ātappamanvāya padhānamanvāya anuyogamanvāya appamādamanvāya sammāmanasikāramanvāya tathārūpaṁ cetosamādhiṁ phusati, yathāsamāhite citte taṁ pubbenivāsaṁ anussarati, tato paraṁ nānussarati.
                - generic [ref=e3063] [cursor=pointer]: ✦
              - generic [ref=e3064]:
                - generic [ref=e3065]:
                  - generic [ref=e3066] [cursor=pointer]: ✦
                  - text: Будучи бездомным и практикуя усердие, стремление, прилежание, правильное представление, оно достигает такого уровня умственной сосредоточенности, что помнит свои предыдущие существования, но не помнит других мест.
                  - generic [ref=e3067] [cursor=pointer]: ✦
                - generic [ref=e3068]:
                  - generic [ref=e3069] [cursor=pointer]: ✦
                  - text: Having gone forth from the home life into homelessness, he—through ardency, through exertion, through commitment, through heedfulness, through right attention—touches an awareness-concentration such that in his concentrated mind he recollects that former life, but nothing prior to that.
                  - generic [ref=e3070] [cursor=pointer]: ✦
          - paragraph [ref=e3071]:
            - generic [ref=e3072]:
              - generic [ref=e3073]:
                - generic [ref=e3074] [cursor=pointer]: ✦
