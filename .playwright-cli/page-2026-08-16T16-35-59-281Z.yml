                - generic [ref=e2617] [cursor=pointer]: ✦
              - generic [ref=e2618]:
                - generic [ref=e2619]:
                  - generic [ref=e2620] [cursor=pointer]: ✦
                  - text: Таковы, монахи, эти отшельники и брахманы, проповедующие вечность, на четырех основаниях учащие, что и свое „я“, и мир вечны.
                  - generic [ref=e2621] [cursor=pointer]: ✦
                - generic [ref=e2622]:
                  - generic [ref=e2623] [cursor=pointer]: ✦
                  - text: “These, monks, are the contemplatives & brahmans who are adherents of eternalism, who proclaim an eternal self & cosmos on four grounds.
