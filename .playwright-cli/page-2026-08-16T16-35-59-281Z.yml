              - generic [ref=e333]:
                - generic [ref=e334]:
                  - generic [ref=e335] [cursor=pointer]: ✦
                  - text: Однажды Благостный шел по главной дороге между Раджагахой и Наландой с большой толпой монахов, с пятью сотнями монахов.
                  - generic [ref=e336] [cursor=pointer]: ✦
                - generic [ref=e337]:
                  - generic [ref=e338] [cursor=pointer]: ✦
                  - text: that on one occasion the Blessed One was traveling on the highway between Rājagaha & Nālanda with a large Saṅgha of monks, approximately 500 monks.
