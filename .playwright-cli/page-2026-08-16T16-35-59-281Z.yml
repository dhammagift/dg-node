              - generic [ref=e2603]:
                - generic [ref=e2604] [cursor=pointer]: ✦
                - text: Idaṁ, bhikkhave, catutthaṁ ṭhānaṁ, yaṁ āgamma yaṁ ārabbha eke samaṇabrāhmaṇā sassatavādā sassataṁ attānañca lokañca paññapenti.
                - generic [ref=e2605] [cursor=pointer]: ✦
              - generic [ref=e2606]:
                - generic [ref=e2607]:
                  - generic [ref=e2608] [cursor=pointer]: ✦
                  - text: Таково, монахи, четвертое основание, исходя из которого и о котором [говорят] некоторые отшельники и брахманы, проповедующие вечность, учащие, что и свое „я“, и мир вечны.
