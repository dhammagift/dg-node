                  - text: Мы же, которые были манопадосика, — мы долгое время рассуждали друг о друге. Когда мы долгое время рассуждали друг о друге, испортились наши мысли друг о друге. Испорченные в мыслях друг о друге, мы ослаблены телом, ослаблены мыслями. Оставив существование в этом сонме, мы достигли здешнего состояния
