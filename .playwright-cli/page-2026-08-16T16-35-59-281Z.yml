              - generic [ref=e508]:
                - generic [ref=e509]:
                  - generic [ref=e510] [cursor=pointer]: ✦
                  - text: И вот Благостный, узнав о такого рода разговоре этих монахов, подошел к той беседке и, подойдя, сел на предложенное сиденье.
                  - generic [ref=e511] [cursor=pointer]: ✦
                - generic [ref=e512]:
                  - generic [ref=e513] [cursor=pointer]: ✦
                  - text: "Then the Blessed One, knowing this discussion of the monks, went to the pavilion and, on arrival, sat down on a seat laid out. Seated, he addressed the monks:"
