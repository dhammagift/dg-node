              - generic [ref=e4140]:
                - generic [ref=e4141] [cursor=pointer]: ✦
                - text: Santi, bhikkhave, eke samaṇabrāhmaṇā amarāvikkhepikā, tattha tattha pañhaṁ puṭṭhā samānā vācāvikkhepaṁ āpajjanti amarāvikkhepaṁ catūhi vatthūhi.
