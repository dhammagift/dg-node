              - generic [ref=e2889]:
                - generic [ref=e2890]:
                  - generic [ref=e2891] [cursor=pointer]: ✦
                  - text: “Я — Брахма, великий Брахма, победоносный, непобедимый, всевидящий, всесильный, владыка, творец, созидатель, наилучший устроитель, повелитель, отец бывшего и будущего!
                  - generic [ref=e2892] [cursor=pointer]: ✦
                - generic [ref=e2893]:
                  - generic [ref=e2894] [cursor=pointer]: ✦
