          - paragraph [ref=e7713]:
            - generic [ref=e7714]:
              - generic [ref=e7715]:
                - generic [ref=e7716] [cursor=pointer]: ✦
                - text: Ye hi keci, bhikkhave, samaṇā vā brāhmaṇā vā pubbantakappikā vā aparantakappikā vā pubbantāparantakappikā vā pubbantāparantānudiṭṭhino pubbantāparantaṁ ārabbha anekavihitāni adhimuttipadāni abhivadanti, sabbe te imeheva dvāsaṭṭhiyā vatthūhi antojālīkatā, ettha sitāva ummujjamānā ummujjanti, ettha pariyāpannā antojālīkatāva ummujjamānā ummujjanti.
                - generic [ref=e7717] [cursor=pointer]: ✦
              - generic [ref=e7718]:
                - generic [ref=e7719]:
                  - generic [ref=e7720] [cursor=pointer]: ✦
                  - text: Ибо, монахи, все те отшельники или брахманы, которые заняты прежними временами, и заняты будущими временами, и заняты прежними и будущими временами, рассуждают о прежних и будущих временах и выдвигают различные суждения о прежних и будущих временах, заключены в сеть благодаря этим шестидесяти двум основаниям — они выскакивают, но, выскакивая, остаются здесь; они выскакивают, но, выскакивая, вконец запутываются здесь, заключенные в сеть.
                  - generic [ref=e7721] [cursor=pointer]: ✦
                - generic [ref=e7722]:
                  - generic [ref=e7723] [cursor=pointer]: ✦
                  - text: “Any contemplatives & brahmans who are theorists about the past, theorists about the future, & theorists about the past & the future, who hold views about the past & the future, who approve of various beliefs with reference to the past & the future, all come under this net with its 62 interstices. When emerging, they emerge trapped here. When emerging, they emerge encompassed here under this net.
                  - generic [ref=e7724] [cursor=pointer]: ✦
          - paragraph [ref=e7725]:
            - generic [ref=e7726]:
              - generic [ref=e7727]:
                - generic [ref=e7728] [cursor=pointer]: ✦
                - text: "Seyyathāpi, bhikkhave, dakkho kevaṭṭo vā kevaṭṭantevāsī vā sukhumacchikena jālena parittaṁ udakadahaṁ otthareyya. Tassa evamassa: ‘ye kho keci imasmiṁ udakadahe oḷārikā pāṇā, sabbe te antojālīkatā. Ettha sitāva ummujjamānā ummujjanti; ettha pariyāpannā antojālīkatāva ummujjamānā ummujjantī’ti;"
                - generic [ref=e7729] [cursor=pointer]: ✦
                - generic [ref=e7730]:
                  - generic [ref=e7731] [cursor=pointer]: ✦
                  - text: udakadahaṁ → udakarahadaṁ (sya-all)
                  - generic [ref=e7732] [cursor=pointer]: ✦
              - generic [ref=e7733]:
                - generic [ref=e7734]:
                  - generic [ref=e7735] [cursor=pointer]: ✦
                  - text: "И это, монахи, как искусный рыбак или ученик рыбака, раскинув в маленьком пруду сеть с мелкой ячейкой, может сказать себе: „Ведь все те [сколько-нибудь] большие существа, которые есть в этом пруду, заключены в сеть, — они выскакивают, но, выскакивая, остаются здесь; они выскакивают, но, выскакивая, вконец запутываются здесь, заключенные в сеть“ —"
                  - generic [ref=e7736] [cursor=pointer]: ✦
                - generic [ref=e7737]:
                  - generic [ref=e7738] [cursor=pointer]: ✦
                  - text: "Just as if a deft fisherman or fisherman’s apprentice were to cover a small body of water with a fine-meshed net: The thought would occur to him, ‘Any sizeable creatures in this body of water all come under this net. When emerging, they emerge trapped here. When emerging, they emerge encompassed here under this net.’"
