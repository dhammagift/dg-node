                - generic [ref=e7745]:
                  - generic [ref=e7746] [cursor=pointer]: ✦
                  - text: так же точно, монахи, и все те отшельники или брахманы, которые заняты прежними временами, и заняты будущими временами, и заняты прежними и будущими временами, рассуждают о прежних и будущих временах и выдвигают различные суждения о прежних и будущих временах, — заключены в сеть благодаря этим шестидесяти двум основаниям — они выскакивают, но, выскакивая, остаются здесь; они выскакивают, но, выскакивая, вконец запутываются здесь, заключенные в сеть.
