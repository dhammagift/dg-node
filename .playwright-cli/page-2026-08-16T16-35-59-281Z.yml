                - text: ‘ayaṁ kho bhavaṁ brahmā mahābrahmā abhibhū anabhibhūto aññadatthudaso vasavattī issaro kattā nimmātā seṭṭho sajitā vasī pitā bhūtabhabyānaṁ.
                - generic [ref=e2973] [cursor=pointer]: ✦
              - generic [ref=e2974]:
                - generic [ref=e2975]:
                  - generic [ref=e2976] [cursor=pointer]: ✦
                  - text: ‘Ведь он — досточтимый Брахма, великий Брахма, победоносный, непобедимый, всевидящий, всесильный, владыка, творец, созидатель, наилучший устроитель, повелитель, отец бывшего и будущего.
                  - generic [ref=e2977] [cursor=pointer]: ✦
                - generic [ref=e2978]:
