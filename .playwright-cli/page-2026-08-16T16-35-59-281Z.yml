              - generic [ref=e344]:
                - generic [ref=e345]:
                  - generic [ref=e346] [cursor=pointer]: ✦
                  - text: А странствующий аскет Суппия тоже шел по главной дороге между Раджагахой и Наландой с юным учеником Брахмадаттой.
