              - generic [ref=e4143]:
                - generic [ref=e4144]:
                  - generic [ref=e4145] [cursor=pointer]: ✦
                  - text: Есть, монахи, некоторые отшельники и брахманы, уклончивые, словно скользкая рыба, на четырех основаниях ведущие уклончивую речь, когда им задают тот или иной вопрос, — уклончивую, словно скользкая рыба.
