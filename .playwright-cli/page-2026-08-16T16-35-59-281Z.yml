            - generic [ref=e605]:
              - generic [ref=e606]:
                - generic [ref=e607] [cursor=pointer]: ✦
                - text: “Mamaṁ vā, bhikkhave, pare avaṇṇaṁ bhāseyyuṁ, dhammassa vā avaṇṇaṁ bhāseyyuṁ, saṅghassa vā avaṇṇaṁ bhāseyyuṁ, tatra tumhehi na āghāto na appaccayo na cetaso anabhiraddhi karaṇīyā.
                - generic [ref=e608] [cursor=pointer]: ✦
              - generic [ref=e609]:
                - generic [ref=e610]:
                  - generic [ref=e611] [cursor=pointer]: ✦
                  - text: “Когда другие порицают меня, или порицают дхамму, или порицают сангху, то вы, монахи, не должны испытывать ни гнева, ни недовольства, ни неприязни в сердце.
                  - generic [ref=e612] [cursor=pointer]: ✦
                - generic [ref=e613]:
                  - generic [ref=e614] [cursor=pointer]: ✦
                  - text: “Monks, if others were to speak in dispraise of me, in dispraise of the Dhamma, or in dispraise of the Saṅgha, neither hatred nor antagonism nor displeasure of mind would be proper.
