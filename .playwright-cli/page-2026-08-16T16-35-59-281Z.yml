                  - text: И вот, монахи, что касается тех отшельников и брахманов, которые проповедуют вечность и на четырех основаниях учат, что и свое „я“, и мир вечны, то эти почтенные отшельники и брахманы ощущают, как незнающие и невидящие, беспокоятся и мечутся, как охваченные жаждой.
