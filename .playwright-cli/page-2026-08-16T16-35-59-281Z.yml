                - text: ‘Pisuṇaṁ vācaṁ pahāya pisuṇāya vācāya paṭivirato samaṇo gotamo, ito sutvā na amutra akkhātā imesaṁ bhedāya, amutra vā sutvā na imesaṁ akkhātā amūsaṁ bhedāya. Iti bhinnānaṁ vā sandhātā, sahitānaṁ vā anuppadātā samaggārāmo samaggarato samagganandī samaggakaraṇiṁ vācaṁ bhāsitā’ti—
                - generic [ref=e873] [cursor=pointer]: ✦
              - generic [ref=e874]:
                - generic [ref=e875]:
                  - generic [ref=e876] [cursor=pointer]: ✦
                  - text: „Отказываясь от клеветнической речи, избегая клеветнической речи, отшельник Готама не рассказывает в другом месте услышанного здесь, чтобы не вызвать раздора со здешними, и не рассказывает здесь услышанного в другом месте, чтобы не вызвать раздора с тамошними. Он соединяет разобщенных, поощряет соединенных, удовлетворен согласием, доволен согласием, наслаждается согласием, ведет речь, родящую согласие“ —
                  - generic [ref=e877] [cursor=pointer]: ✦
                - generic [ref=e878]:
                  - generic [ref=e879] [cursor=pointer]: ✦
                  - text: "“Or: ‘Abandoning divisive speech, the contemplative Gotama abstains from divisive speech. What he has heard here he does not tell there to break those people apart from these people here. What he has heard there he does not tell here to break these people apart from those people there. Thus reconciling those who have broken apart or cementing those who are united, he loves concord, delights in concord, enjoys concord, speaks things that create concord.’"
