            - generic [ref=e2673]:
              - generic [ref=e2674]:
                - generic [ref=e2675] [cursor=pointer]: ✦
                - text: Vedanānaṁ samudayañca atthaṅgamañca assādañca ādīnavañca nissaraṇañca yathābhūtaṁ viditvā anupādāvimutto, bhikkhave, tathāgato.
