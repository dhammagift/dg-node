                  - text: И вот, монахи, что касается тех отшельников и брахманов, которые уклончивы, словно скользкая рыба, и на четырех основаниях ведут уклончивую речь, когда им задают тот или иной вопрос, — уклончивую, словно скользкая рыба, то эти почтенные отшельники и брахманы ощущают, как незнающие и невидящие, беспокоятся и мечутся, как охваченные жаждой.
