              - generic [ref=e4154]:
                - generic [ref=e4155]:
                  - generic [ref=e4156] [cursor=pointer]: ✦
                  - text: Исходя же из чего и о чем [говорят] эти почтенные отшельники и брахманы, уклончивые, словно скользкая рыба, на четырех основаниях ведущие уклончивую речь, когда им задают тот или иной вопрос, — уклончивую, словно скользкая рыба?
                  - generic [ref=e4157] [cursor=pointer]: ✦
                - generic [ref=e4158]:
                  - generic [ref=e4159] [cursor=pointer]: ✦
                  - text: And with reference to what, coming from what, do these honorable contemplatives & brahmans, when being asked questions regarding this or that, resort to verbal contortions, to eel-wriggling, on four grounds?
